  # ── Planner — Auto-plan ───────────────────────────────────────────────────────

  /planner/auto-plan:
    post:
      tags: [planner]
      operationId: autoPlan
      summary: Automatisch weekplan genereren
      description: |
        Genereert voor een opgegeven datum een automatisch veldrooster op basis van de geplande
        wedstrijden, veldbeschikbaarheid, speeltijden en teamregels.

        **Voert niets door** — puur simulatie/voorstel.
        Gebruik `/planner/auto-plan/toepassen` om het plan daadwerkelijk te boeken.

        Met `?format=html` of `?format=pdf` (#1364) komt het resultaat als gedeeld document terug
        (kolommen Tijd, Team, Tegenstander, Veld, Competitie); `?tab=huidig|optimaal` kiest welke kant.
      security:
        - easyAuth: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, html, pdf]
            default: json
        - name: tab
          in: query
          required: false
          description: Alleen bij format=html|pdf — welke kant van het plan in het document komt
          schema:
            type: string
            enum: [huidig, optimaal]
            default: huidig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoPlanRequest'
      responses:
        '200':
          description: Gegenereerd auto-plan (JSON), of bij format=html|pdf het gedeelde document
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoPlanResponse'
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "`?format=pdf` terwijl de clubinstelling PdfExportIngeschakeld uit staat (#1459)"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/auto-plan/deel:
    post:
      tags: [planner]
      operationId: autoPlanDeel
      summary: Planning delen zoals getoond (stateless)
      description: |
        Rendert dezelfde HTML/PDF als `/planner/auto-plan?format=` (#1460), maar van de lijst die de
        browser meestuurt — dus inclusief handmatig versleepte blokken. Niets wordt opgeslagen of
        herberekend. De club komt van de aanroeper; een afwijkende `clubCode` in de body geeft 403.

        Limieten: maximaal 500 wedstrijden, tekstvelden maximaal 200 tekens zonder stuurtekens,
        `tijd` als `HH:mm` (of leeg), `datum` als `yyyy-MM-dd` tussen 2020-01-01 en 2100-12-31,
        body maximaal 512 KB (413).
      security:
        - easyAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [html, pdf]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datum, wedstrijden]
              properties:
                datum:
                  type: string
                  format: date
                tab:
                  type: string
                  enum: [huidig, optimaal]
                  default: huidig
                clubCode:
                  type: string
                  description: Optioneel; moet gelijk zijn aan de club van de aanroeper.
                wedstrijden:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [teamNaam]
                    properties:
                      teamNaam: {type: string, maxLength: 200}
                      wedstrijd: {type: string, maxLength: 200, description: 'Thuis - Uit'}
                      competitiesoort: {type: string, maxLength: 200, nullable: true}
                      tijd: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', nullable: true}
                      veld: {type: string, maxLength: 200, nullable: true}
      responses:
        '200':
          description: Het gedeelde document
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "`?format=pdf` terwijl de clubinstelling PdfExportIngeschakeld uit staat (#1459)"
        '413':
          description: Request body te groot
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/pdf-export:
    get:
      tags: [planner]
      operationId: pdfExportStatus
      summary: Staat PDF-export aan voor de gekozen club?
      description: |
        #1459: geeft alleen de aan/uit-stand van de clubinstelling PdfExportIngeschakeld terug, zodat
        Planning de PDF-knop alleen toont als `?format=pdf` werkt. Net als `/planner/veldbezetting`
        open voor elke ingelogde rol (`admin` óf `user`); de volledige instellingen onder
        `/beheer/settings` blijven admin-only. Club via `X-Club-Code`. Geen rij = uit.
      security:
        - easyAuth: []
      responses:
        '200':
          description: De stand van de instelling
          content:
            application/json:
              schema:
                type: object
                required: [pdfExportIngeschakeld]
                properties:
                  pdfExportIngeschakeld:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/veldbezetting:
    get:
      tags: [planner]
      operationId: veldbezetting
      summary: Wedstrijden op een datum ophalen, zonder optimalisatie
      description: |
        Geeft de wedstrijden terug die op een datum al gepland staan, rechtstreeks uit de
        laatst gesynchroniseerde Sportlink-data — zonder de scheduling-optimalisatie die
        `/planner/auto-plan` uitvoert. Bedoeld als snelle,
        goedkope "wat staat er nu al gepland"-weergave. Voedt de Planning-pagina, die sinds #1400
        generiek zichtbaar is voor elke ingelogde gebruiker — vereist daarom alleen `admin` óf
        `user` (voorheen uitsluitend `admin`); in deze tag geldt dat verder alleen voor
        `/planner/pdf-export` (#1459).
      security:
        - easyAuth: []
      parameters:
        - name: datum
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Datum in yyyy-MM-dd formaat
          example: "2026-08-22"
        - name: format
          in: query
          required: false
          description: json (standaard), html of pdf (#1364) — het gedeelde document voor de deel-knop op Planning
          schema:
            type: string
            enum: [json, html, pdf]
            default: json
      responses:
        '200':
          description: Wedstrijden op deze datum, gesorteerd op aanvangstijd (JSON), of bij format=html|pdf het gedeelde document
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VeldbezettingItem'
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "`?format=pdf` terwijl de clubinstelling PdfExportIngeschakeld uit staat (#1459)"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/auto-plan/toepassen:
    post:
      tags: [planner]
      operationId: autoPlanToepassen
      summary: Automatisch plan toepassen
      description: |
        Past het gegenereerde auto-plan toe door wedstrijdsloten te boeken in
        `planner.GeplandeWedstrijden`. Schrijft alleen voor wedstrijden die nog
        geen slot hebben.

        **Let op:** alleen beschikbaar als de club-code `ALLSTARS` is (testmodus).
        Productie-clubs ontvangen HTTP 403.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoPlanToepassenRequest'
      responses:
        '200':
          description: Plan toegepast
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoPlanToepassenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
