                $ref: '#/components/schemas/SportlinkMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Wedstrijd of PublicMatchId niet gevonden
        '409':
          description: |
            Extension staat uit, koppeling ontbreekt/verlopen, guardrail geblokkeerd, of (#1341)
            "Veld wijzigen" staat uit voor de Wedstrijdzaken-rol bij deze club.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Sportlink gaf geen bruikbare respons
        '504':
          description: Sportlink reageerde niet op tijd. De mutatie is bewust NIET automatisch herhaald — de uitkomst bij Sportlink is onbekend; controleer eerst in Sportlink of de actie al is doorgevoerd (#1387, #1417)
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

  /sportlink/match/{wedstrijdcode}/officials:
    put:
      tags: [sportlink]
      operationId: putSportlinkOfficials
      summary: Officials (scheidsrechter/assistenten) toewijzen (#994, epic #986) — sinds #1319 live bevestigd
      description: |
        **Sinds #1319 live bevestigd** (was scaffolding, altijd code-gelockt via een aparte
        `forceDryRun`-lock, onafhankelijk van de club-instelling `sportlinkDryRun`): endpoint (`PUT
        competition/match/official/MatchOfficialsAction`) en requestbody zijn met een echte
        netwerktrace bevestigd te werken. De mutatie respecteert nu de gewone `sportlinkDryRun`-
        instelling, net als `.../dressingrooms` en `.../field`. Zelfde volgorde als `.../dressingrooms`
        (resolve → guard `SportlinkMutationSoort.Officials` → audit → mutatie), met een
        taakspecifieke responsparser: als één official een `ValidationDescription` heeft, wordt
        `IsSuccess=false` gezet ook al is de HTTP-status 200 ("opgeslagen met fouten" in Sportlink
        zelf). AVG: uitsluitend positie + een door de beheerder ingevoerde relatiecode/persoons-ID
        per regel — geen zoekfunctie, geen namen.
      security:
        - easyAuth: []
      parameters:
        - name: wedstrijdcode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Officials:
                  type: array
                  items:
                    type: object
                    properties:
                      OfficialPosition:
                        type: string
                        description: "ONBEVESTIGD — aangenomen waarden, bijv. \"Referee\"/\"AssistantReferee1\"/\"AssistantReferee2\""
                      PersoonId:
                        type: string
                        description: Relatiecode/persoons-identifier zoals ingevoerd door de beheerder — geen naam.
      responses:
        '200':
          description: Mutatieresultaat (IsSuccess kan false zijn — bijv. als Sportlink een official afwijst)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportlinkMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Wedstrijd of PublicMatchId niet gevonden
        '409':
          description: |
            Extension staat uit, koppeling ontbreekt/verlopen, guardrail geblokkeerd, of (#1341)
            "Scheidsrechters toewijzen" staat uit voor de Wedstrijdzaken-rol bij deze club.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Sportlink gaf geen bruikbare respons
        '504':
          description: Sportlink reageerde niet op tijd. De mutatie is bewust NIET automatisch herhaald — de uitkomst bij Sportlink is onbekend; controleer eerst in Sportlink of de actie al is doorgevoerd (#1387, #1417)
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

  /sportlink/match/{wedstrijdcode}/change-request:
    put:
      tags: [sportlink]
      operationId: putSportlinkMatchChangeRequest
      summary: Wijzigingsverzoek datum/tijd/accommodatie (#995, epic #986) — ALLEEN stap 1 (valideren), sinds #1319 live bevestigd
      description: |
        **Sinds #1319 live bevestigd, en de enige mutatie die een ECHTE tegenstander raakt:**
        Sportlink werkt voor datum/tijd/accommodatie in twee stappen (valideren → bevestigen) — de
        bevestigingsstap stuurt een goedkeuringsverzoek naar de tegenstander. Dit endpoint bouwt
        UITSLUITEND stap 1: er bestaat bewust geen endpoint, client-methode of UI-knop voor stap 2.
        Zelfde onderliggende Sportlink-endpoint als `.../field`
        (`PUT competition/match/UpdateMatchDetails`), maar met `MatchDate`/`StartTime`/`FacilityId`/
        `MatchChangeRequestRemarks` overschreven in plaats van het veld. Was tot #1319 altijd
        gesimuleerd via een aparte code-niveau `forceDryRun`-lock, onafhankelijk van de
        club-instelling `sportlinkDryRun` — de eigenaar heeft die lock na een live netwerktrace
        opgeheven; de mutatie respecteert nu de gewone `sportlinkDryRun`-instelling. Guard:
        `SportlinkMutationSoort.DatumTijdAccommodatie` (uitsluitend
        `IsHomeMatch` + de generieke niet-afgelast/niet-concept-checks — geen specifieke
        `IsXxxAllowed`-vlag bestaat hiervoor bij Sportlink). `Toelichting` is verplicht.
      security:
        - easyAuth: []
      parameters:
        - name: wedstrijdcode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Toelichting]
              properties:
                NieuweDatum:
                  type: string
                  nullable: true
                  description: "yyyy-MM-dd — null laat de datum ongewijzigd (blijft uit de snapshot)."
                NieuweStartTijd:
                  type: string
                  nullable: true
                  description: "HH:mm — null laat de starttijd ongewijzigd."
                NieuweFacilityId:
                  type: string
                  nullable: true
                  description: null laat de accommodatie ongewijzigd.
                Toelichting:
                  type: string
                  description: Verplicht — een wijzigingsverzoek zonder toelichting is voor de tegenstander niet te beoordelen.
      responses:
        '200':
          description: |
            Diagnostiektrace (#1320) — Resultaat.Mutatie.IsSuccess kan alsnog false zijn; in de
            praktijk altijd een gesimuleerd resultaat door de code-lock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportlinkMatchWijzigingsverzoekTraceResponse'
        '400':
          description: Toelichting ontbreekt, of NieuweDatum/NieuweStartTijd is geen geldige datum/tijd
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Wedstrijd of PublicMatchId niet gevonden
        '409':
          description: Extension staat uit, koppeling ontbreekt/verlopen, of guardrail geblokkeerd
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Sportlink gaf geen bruikbare respons
        '504':
          description: Sportlink reageerde niet op tijd. De mutatie is bewust NIET automatisch herhaald — de uitkomst bij Sportlink is onbekend; controleer eerst in Sportlink of de actie al is doorgevoerd (#1387, #1417)
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

  /sportlink/audit/{id}/notitie:
    put:
      tags: [sportlink]
      operationId: putSportlinkAuditNotitie
      summary: Testnotitie koppelen aan een Sportlink-mutatieauditpoging (#1320)
      description: |
        Voor de eigenaar-gestuurde productieproef met trace van validatie en bevestiging
        (issue #995/#1320): na een live-testpoging kan de eigenaar vastleggen wat er in Sportlink
        Club zelf zichtbaar was. Scoped op ClubCode — een audit-rij van een andere club is hiermee
        niet te wijzigen (404). Lege string toegestaan om een eerdere notitie te wissen.
      security:
        - easyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Notitie]
              properties:
                Notitie:
                  type: string
                  maxLength: 1000
                  nullable: false
      responses:
        '200':
          description: Notitie opgeslagen
        '400':
          description: Notitie ontbreekt of is langer dan 1000 tekens
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Audit-record niet gevonden voor deze club
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Audit-service niet beschikbaar

  /sportlink/change-requests:
    get:
      tags: [sportlink]
      operationId: getSportlinkChangeRequests
      summary: Inkomende wijzigingsverzoeken ophalen (#996, epic #986)
      description: |
        Niet wedstrijdcode-gescoped: `MatchChangeRequests` levert alle openstaande verzoeken voor
        het gekoppelde serviceaccount in één keer. Filter client-side op
        `StatusGroep == "OPEN"` (en `IsIncomingRequest == true` voor verzoeken die op ons wachten).

        Sinds #1111 draagt elk item ook `Wedstrijd`: onze eigen wedstrijdcontext (wedstrijdnummer,
        teams, datum, tijd, accommodatie) uit `his.matches` via de PublicMatchId-cache. `null` als
        de wedstrijd nog niet gecachet is. Openstaande verzoeken (`StatusGroep` OPEN) staan vooraan, inkomend vóór uitgaand.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Lijst met wijzigingsverzoeken (kan leeg zijn), openstaande eerst
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportlinkChangeRequestOverzichtItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Extension staat uit, of de Sportlink-koppeling ontbreekt/is verlopen
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

  /sportlink/change-requests/{publicRequestId}/action:
    put:
      tags: [sportlink]
      operationId: putSportlinkChangeRequestAction
      summary: Wijzigingsverzoek goedkeuren of afwijzen (#996, epic #986)
      description: |
        Haalt zelf `PublicPersonId` van het gekoppelde serviceaccount op via `user/UserInfo` vóór
        de actie. Geen `SportlinkMutationGuard`-check (die bewaakt onze eigen wedstrijd-
        mutatievlaggen, niet het afhandelen van andermans verzoek) — audit-logging blijft wel
        verplicht. `Remarks` is verplicht bij `DENY`.
      security:
        - easyAuth: []
      parameters:
        - name: publicRequestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [PublicMatchId, Actie]
              properties:
                PublicMatchId: { type: string }
                Actie:
                  type: string
                  enum: [APPROVE, DENY]
                Remarks: { type: string, nullable: true }
      responses:
        '200':
          description: Mutatieresultaat (IsSuccess kan alsnog false zijn)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportlinkMutationResponse'
        '400':
          description: Ontbrekende/ongeldige actie, of Remarks ontbreekt bij DENY
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Extension staat uit, of de Sportlink-koppeling ontbreekt/is verlopen
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Sportlink gaf geen bruikbare respons
        '504':
          description: Sportlink reageerde niet op tijd. De mutatie is bewust NIET automatisch herhaald — de uitkomst bij Sportlink is onbekend; controleer eerst in Sportlink of de actie al is doorgevoerd (#1387, #1417)
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

  /sportlink/club-match:
    post:
      tags: [sportlink]
      operationId: postSportlinkClubMatch
      summary: Oefenwedstrijd ("clubwedstrijd") aanmaken (#997, epic #986) — contract live bevestigd (#1427)
      description: |
        Volgt de club-instelling `sportlinkDryRun`. **Sinds #1427 live bevestigd:** de body is
        veld voor veld gelijk aan wat Sportlink Clubs eigen formulier verstuurt (console-trace,
        HTTP 200 met nieuw `PublicMatchId`). De server haalt daarvoor eerst vier read-only lijsten
        op (`ClubMatchDefaults`, `PickListsTeams`, `PickListsLocation`,
        `PickListsMatchInformation`) en leidt daaruit team-ID (`T…`), leeftijdscategorie,
        spelactiviteit en veld (`SubFacilityId`) af. Het wedstrijdnummer (`ExternalMatchId`) komt sinds #1437
        uit een eigen teller per club en speeldag: `YYMMDD` + tweecijferig volgnummer (26100201,
        26100202, …), pas gereserveerd vlak voor de Sportlink-aanroep; ook een dry-run verbruikt een
        nummer. De spelactiviteit komt uit de clubinstelling `SportlinkSpelactiviteit` (omschrijving
        of IdTag; gevonden = wint altijd), anders van het team. Een team of veld dat Sportlink
        niet (eenduidig) kent geeft 400; wat niet af te leiden is valt terug op Sportlinks
        standaardwaarden met een waarschuwing. Er is vooraf geen bestaande wedstrijd, dus geen
        `SportlinkMutationGuard`-check — alleen de eigen toggle + EgressGuard. Bewust NIET gebouwd:
        uitslag vastleggen (`ClubMatchScore`). Verwijderen: zie `DELETE /sportlink/club-match/{publicMatchId}` (#1440).
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [MatchDateTime, TeamNaam, Tegenstander]
              description: |
                Het formulier stuurt alleen wat een wedstrijdsecretaris snel intikt; de server leidt
                de Sportlink-velden af uit Sportlinks eigen aanmaaklijsten (#1427). Teamnaam → het
                `T…`-team-ID (exacte naam, of onze naam met clubvoorvoegsel die eindigt op Sportlinks
                teamnaam; alleen een unieke treffer telt). Veld → `SubFacilityId` op veldnaam.
              properties:
                MatchDateTime:
                  type: string
                  format: date-time
                  description: Datum + aanvangstijd (lokale tijd van de club, zonder tijdzone).
                Duration:
                  type: integer
                  default: 90
                  minimum: 1
                  maximum: 240
                  description: Duur in minuten.
                TeamNaam:
                  type: string
                  description: Naam van een actief clubteam zoals `GET /beheer/teams` die teruggeeft (hoofdletterongevoelig), of vrije tekst als `VrijeTekst` true is.
                VrijeTekst:
                  type: boolean
                  default: false
                  description: |
                    #1427: `TeamNaam` is vrije tekst (GUI-optie "Vrije tekst invoeren…", #1396). Geen 400
                    als de naam geen actief clubteam is; Sportlinks standaardteam levert dan het team-ID
                    (net als in Sportlinks eigen formulier) en de vrije tekst staat als naam van het
                    thuisteam, met een waarschuwing.
                Tegenstander:
                  type: string
                  description: Vrije tekst — gaat als `AwayTeam` (weergavenaam) mee.
                VeldNummer:
                  type: integer
                  nullable: true
                  description: Veldnummer van een actief veld uit `GET /beheer/velden`; onbekend/inactief veld → 400.
                Description:
                  type: string
                  nullable: true
                  description: Eigen omschrijving; leeg → `Oefenwedstrijd [team] - [tegenstander]`.
                Velddeel:
                  type: string
                  enum: ['1.0', '0.5', '0.25', '0.125']
                  default: '1.0'
                  description: |
                    #1437: het deel van het veld (`FieldSize` in Sportlinks body) — heel, half, kwart of achtste veld;
                    `FieldOffset` is altijd `0` (eerste deel). **Aanname:** alleen `1.0` is live bevestigd, de
                    notatie van de overige drie is geëxtrapoleerd en nog niet met een echte wedstrijd gecontroleerd.
                    Een andere waarde → 400.
                AgeClassCode:
                  type: string
                  nullable: true
                  description: |
                    #1437: Sportlink-`Id` van de leeftijdscategorie (bijv. `110`, uit `GET /sportlink/club-match/formulier`).
                    Moet in Sportlinks lijst staan (anders 400) en wint van de categorie die uit het team volgt.
                    Leeg → afleiden uit het team, anders Sportlinks standaard met een waarschuwing.
      responses:
        '200':
          description: Mutatieresultaat. Een afwijzing door Sportlink zonder eigen `Violations` (bijv. HTTP 602) krijgt sinds #1427 Sportlinks `Message` als enige violation (`Sportlink <status>: <message>`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OefenwedstrijdAanmaakResponse'
        '400':
          description: MatchDateTime/TeamNaam/Tegenstander ontbreekt, Duration buiten 1–240, Velddeel niet een van 1.0/0.5/0.25/0.125, AgeClassCode niet in Sportlinks lijst, team niet bekend als actief (alleen zonder `VrijeTekst`), veld niet bekend als actief, team/veld niet (eenduidig) gevonden in Sportlinks lijsten, of er zijn voor die speeldag al 99 wedstrijdnummers uitgegeven
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Extension staat uit, of de Sportlink-koppeling ontbreekt/is verlopen
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Sportlink gaf geen bruikbare respons
        '504':
          description: Sportlink reageerde niet op tijd. De mutatie is bewust NIET automatisch herhaald — de uitkomst bij Sportlink is onbekend; controleer eerst in Sportlink of de actie al is doorgevoerd (#1387, #1417)
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

  /sportlink/club-match/{publicMatchId}:
    delete:
      tags: [sportlink]
      operationId: deleteSportlinkClubMatch
      summary: Clubwedstrijd (oefenwedstrijd) verwijderen (#1440) — contract NIET live bevestigd, altijd dry-run
      description: |
        Verwijdert een clubwedstrijd bij Sportlink via `DELETE competition/match/clubmatch/ClubMatchDelete?PublicMatchId=`.
        Methode, parameter en foutvorm komen uit Sportlinks publieke frontend-bundle en zijn **nooit live gezien**.
        Daarom staat de aanroep hard op dry-run (`ClubMatchDeleteLiveBevestigd = false`), ongeacht de club-instelling
        `sportlinkDryRun`: de respons heeft dan `IsDryRun` en `IsForcedDryRun` op `true` en Sportlink is niet aangeroepen
        (wel de read-only `GET competition/match/Match` voor de guard). Volgorde: toggle + EgressGuard → huidige
        wedstrijd ophalen → `SportlinkMutationGuard` (`Verwijderen`: alleen bij expliciet `IsKernelMatch = false`
        én `IsHomeMatch`, anders 409) → audit "Pending" met het `PublicMatchId` → verwijderen (nooit automatisch
        herhaald) → audit voltooien. De Admin GUI biedt dit alleen aan op het resultaat van "Wedstrijd aanmaken".
      security:
        - easyAuth: []
      parameters:
        - name: publicMatchId
          in: path
          required: true
          description: Sportlink-`PublicMatchId` (letters, cijfers, `-` en `_`, maximaal 64 tekens).
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
      responses:
        '200':
          description: Mutatieresultaat. Een inhoudelijke afwijzing door Sportlink is ook 200, met `IsSuccess = false` en `Violations`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  IsSuccess:
                    type: boolean
                  Violations:
                    type: array
                    nullable: true
                    items:
                      type: string
                  IsDryRun:
                    type: boolean
                  IsForcedDryRun:
                    type: boolean
                    description: Zolang het contract niet live bevestigd is altijd `true`.
                  PublicMatchId:
                    type: string
        '400':
          description: Ongeldig `PublicMatchId`
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Sportlink kent dit `PublicMatchId` niet (meer)
        '409':
          description: Extension staat uit, de Sportlink-koppeling ontbreekt/is verlopen, of de guard weigert (geen clubwedstrijd, `IsKernelMatch` ontbreekt, of geen thuiswedstrijd)
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Sportlink gaf geen bruikbare respons
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)
        '504':
          description: Sportlink reageerde niet op tijd. Bewust NIET automatisch herhaald — controleer eerst in Sportlink of de wedstrijd al weg is (#1417)

