  /beheer/sync/trigger:
    post:
      tags: [beheer]
      operationId: triggerSync
      summary: Synchronisatie starten (fire-and-forget)
      description: |
        Start een Sportlink-synchronisatie op de achtergrond (~5 minuten). Retourneert direct 202.
        Prik op `GET /beheer/sync/status` om de voortgang te bewaken via `lastSyncTimestamp`.
        Met `reset: true` en `season` wordt het volledige seizoen opnieuw opgehaald vanaf de
        seizoensstart (#1352). Zonder `reset` wordt `season` genegeerd.
      security:
        - easyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reset:
                  type: boolean
                  default: false
                  description: Volledig seizoen opnieuw ophalen vanaf de seizoensstart.
                season:
                  type: integer
                  minimum: 2000
                  description: Startjaar van het seizoen (bijv. 2025 voor 2025/2026); verplicht bij reset, maximaal huidig jaar + 1.
      responses:
        '400':
          description: Ongeldig seizoen, seizoen zonder seizoensrij (bestaat niet) of ongeldige body (NL-foutmelding in `error`)
        '202':
          description: Synchronisatie gestart
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncTriggerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
