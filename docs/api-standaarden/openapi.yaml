        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Beveiligde hostsleutel of opslag niet beschikbaar
        '413':
          description: Meer dan 8192 bytes JSON
        '415':
          description: Content-Type application/json vereist
    delete:
      tags: [beheer]
      operationId: deleteSportlinkAutoLogin
      summary: Credentials en opgeslagen afgeleid token verwijderen
      description: Alleen admin en primaire club. Vereist ingerichte hostsleutel. Geen externe login tijdens deze aanvraag.
      security:
        - easyAuth: []
      responses:
