          nullable: true
        Aanvangstijd:
          type: string
          nullable: true
        ThuisTeam:
          type: string
          nullable: true
        UitTeam:
          type: string
          nullable: true
        VeldNaam:
          type: string
          nullable: true
        Soort:
          type: string
          nullable: true
        VeldSubpositie:
          type: string
          nullable: true

    TestDataWedstrijdCreateRequest:
      type: object
