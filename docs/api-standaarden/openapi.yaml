        - body
      properties:
        onderwerp:
          type: string
          nullable: true
        afzender:
          type: string
          nullable: true
          example: "trainer@voorbeeld.nl"
        afzenderNaam:
          type: string
          nullable: true
          example: "Jan de Vries"
        body:
          type: string
          description: Emailtekst om te classificeren (verplicht)

    TestEmailResponse:
      type: object
      properties:
        dryRun:
          type: boolean
          example: true
        opmerking:
          type: string
          example: "Dit verstuurt niets en slaat niets op"
        classificatie:
          type: object
          description: AI-classificatieresultaat
        plannerResponse:
          type: object
          description: Planner-respons op basis van de classificatie (geen DB-mutatie)
        voorbeeldAntwoord:
          type: object
          properties:
            onderwerp:
              type: string
            body:
              type: string
        trace:
          type: object
          description: |
            Beslissingstrace van de pipeline (#1568), PII-arm (geen mailbody of afzender).
            Geordende stappen plus een eindoordeel over de zekerheid.
          properties:
            stappen:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                    example: team-herkenning
                  titel:
                    type: string
                  uitkomst:
                    type: string
                  zekerheid:
                    type: string
                    enum: [Zeker, Onzeker, Mislukt]
                  details:
                    type: object
                    additionalProperties:
                      type: string
            oordeel:
              type: object
              properties:
                isZeker:
                  type: boolean
                  description: false = het antwoord zou in review gaan
                redenen:
                  type: array
                  items:
                    type: string

        leersuggestie:
          type: object
          description: |
            Voorzet voor "Verzoektype corrigeren" in de e-mailtester (#1568 deel C): het door de classificatie gekozen
            verzoektype en een met de PII-arme sanering behandelde samenvatting. De beheerder redigeert hem;
            `POST /beheer/leermomenten` saneert hem opnieuw.
          properties:
            verzoekType:
              type: string
            samenvatting:
              type: string

    # ── Feedback ──────────────────────────────────────────────────────────────

    VraagAntwoord:
      type: object
      properties:
        vraag:
          type: string
        antwoord:
          type: string

    FeedbackContext:
      type: object
      properties:
        pagina:
          type: string
          description: Huidige pagina/route in de admin UI
        versie:
          type: string
          description: Applicatieversie
        rol:
          type: string
        browser:
          type: string

    FeedbackRequest:
      type: object
      required:
        - beschrijving
      properties:
        type:
          type: string
          enum: [Fout, Verzoek, Vraag]
          description: Type melding
        beschrijving:
          type: string
          description: Omschrijving van het probleem of verzoek (max 2000 tekens)
        vragenAntwoorden:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/VraagAntwoord'
        context:
          $ref: '#/components/schemas/FeedbackContext'
          nullable: true
        telemetrie:
          $ref: '#/components/schemas/FeedbackTelemetrie'
          nullable: true
        bevestiging:
          $ref: '#/components/schemas/FeedbackBevestiging'
          nullable: true

    FeedbackTelemetrie:
      type: object
      description: |
        Technische context bij een melding (#764): standaard meegestuurd, door de gebruiker per melding
        uit te zetten (dan weggelaten). De server redigeert alles opnieuw (e-mailadressen, GUID's, tokens,
        querystrings, ID's in paden, naam van de melder) en kapt af op maximaal 5 items per soort en 300
        tekens per item. Wordt nooit in het publieke GitHub-issue opgenomen.
      properties:
        consoleFouten:
          type: array
          maxItems: 5
          items:
            type: string
        mislukteAanroepen:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              methode:
                type: string
              pad:
                type: string
                description: Pad zonder querystring
              status:
                type: integer
              tijdUtc:
                type: string
                format: date-time
              correlatieId:
                type: string
                nullable: true
        navigatiespoor:
          type: array
          maxItems: 5
          items:
            type: string
        browser:
          type: string
          nullable: true
        schermbreedte:
          type: integer
          nullable: true

    FeedbackBevestiging:
      type: object
      description: |
        De door de AI geproduceerde velden zoals `/feedback/preview` ze teruggaf en de beheerder ze
        heeft gezien. Alleen te gebruiken op `/feedback/submit`: de server publiceert dan exact deze
        tekst in plaats van de AI opnieuw te bevragen, zodat het getoonde voorbeeld klopt met wat er
        gepubliceerd wordt.

        De server vertrouwt deze waarden niet: ze gaan door dezelfde sanitizer en dezelfde grenzen
        als alle andere tekst in de body, en de PII-gate blijft onverkort van toepassing op de
        uiteindelijke body.
      properties:
        titel:
          type: string
          description: Wordt afgekapt op 80 tekens
        samenvatting:
          type: string
          description: Wordt afgekapt op 500 tekens
        acceptatiecriteria:
          type: array
          description: Maximaal 5 items; elk item wordt afgekapt op 120 tekens
          maxItems: 5
          items:
            type: string

    FeedbackPreviewResponse:
      type: object
      description: De exacte tekst die bij publicatie openbaar op GitHub zou komen te staan.
      properties:
        titel:
          type: string
          description: Titel van het issue zoals die gepubliceerd zou worden
        body:
          type: string
          description: Volledige markdown-body van het issue zoals die gepubliceerd zou worden
        samenvatting:
          type: string
          description: AI-samenvatting, onveranderd terug te sturen als onderdeel van `bevestiging`
        acceptatiecriteria:
          type: array
          description: AI-acceptatiecriteria, onveranderd terug te sturen als onderdeel van `bevestiging`
          items:
            type: string

    FeedbackValidateResponse:
      type: object
      properties:
        volledig:
          type: boolean
          description: Of de beschrijving voldoende informatie bevat
        vragen:
          type: array
          description: Aanvulvragen als niet volledig (max 3)
          items:
            type: string

    FeedbackSubmitResponse:
      type: object
      description: |
        Een melding van een beheerder wordt direct gepubliceerd; een melding van een gewone gebruiker
        wacht (`status: wacht-op-publicatie`) tot een beheerder haar publiceert.
      properties:
        feedbackId:
          type: string
          format: uuid
        meldingsnummer:
          type: string
          description: Kort nummer (8 tekens) dat een gebruiker kan noemen als hij er later naar vraagt
        status:
          type: string
          enum: [wacht-op-publicatie, gepubliceerd]
        bewaardInOverzicht:
          type: boolean
          description: Onwaar als de database tijdens een directe publicatie door een beheerder onbereikbaar was
        gepubliceerd:
          type: boolean
        issueNummer:
          type: integer
          description: GitHub issue nummer — alleen voor een beheerder; 0 voor een gewone gebruiker
        issueUrl:
          type: string
          format: uri
          nullable: true
          description: URL naar het GitHub issue — alleen voor een beheerder, nooit voor een gewone gebruiker
        waarschuwing:
          type: string
          nullable: true
          description: Bijv. dat de GitHub-integratie niet geconfigureerd is (alleen beheerder)

    FeedbackItem:
      type: object
      properties:
        feedbackId:
          type: string
          format: uuid
        meldingsnummer:
          type: string
        aangemaaktUtc:
          type: string
          format: date-time
        type:
          type: string
          enum: [Fout, Verzoek, Vraag]
        onderwerp:
          type: string
        melderNaam:
          type: string
          nullable: true
          description: Naam-momentopname; null na anonimisering. Alleen in dit beheeroverzicht zichtbaar.
        isGeanonimiseerd:
          type: boolean
        melderRol:
          type: string
          enum: [admin, user]
        pagina:
          type: string
          nullable: true
        issueNummer:
          type: integer
          nullable: true
        issueUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [wacht-op-publicatie, publiceren, gepubliceerd, github-mislukt]

    FeedbackListResponse:
      type: object
      properties:
        totaal:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackItem'

    FeedbackDetailResponse:
      allOf:
        - $ref: '#/components/schemas/FeedbackItem'
        - type: object
          properties:
            beschrijving:
              type: string
            vragenAntwoorden:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/VraagAntwoord'
            issueBody:
              type: string
              description: De tekst die (of zoals ze) op GitHub staat — zonder identiteit en zonder technische context
            appVersie:
              type: string
              nullable: true
            telemetrie:
              type: array
              description: Geredigeerde technische context per bron; leeg na 90 dagen of als de melder het uitzette
              items:
                type: object
                properties:
                  bron:
                    type: string
                    enum: [omgeving, console, netwerk, navigatie]
                  tekst:
                    type: string

    FeedbackPublishResponse:
      type: object
      properties:
        feedbackId:
