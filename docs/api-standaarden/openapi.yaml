      security:
        - easyAuth: []
      responses:
        '200':
          description: Status zonder credentials, Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportlinkAutoLoginStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Beveiligde hostsleutel of opslag niet beschikbaar
    put:
      tags: [beheer]
      operationId: setSportlinkAutoLogin
      summary: Versleutelde logincredentials instellen
      description: Alleen admin en primaire club. Vereist ingerichte hostsleutel. Geen externe login tijdens deze aanvraag.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, totpSecret]
              properties:
                username:
                  type: string
                  maxLength: 320
                  writeOnly: true
                password:
                  type: string
                  format: password
                  maxLength: 1024
                  writeOnly: true
                totpSecret:
                  type: string
                  format: password
                  maxLength: 256
                  writeOnly: true
                totpAlgorithm:
                  type: string
                  enum: [SHA1, SHA256, SHA512]
                  default: SHA1
                totpDigits:
                  type: integer
                  enum: [6, 8]
                  default: 6
                totpPeriodSeconds:
                  type: integer
                  enum: [30, 60]
                  default: 30
      responses:
        '200':
