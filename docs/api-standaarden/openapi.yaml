  /beheer/testdata/teams:
    get:
      tags: [testdata]
      operationId: getTestDataTeams
      summary: Test-teams ophalen (ALLSTARS)
      description: Geeft teams uit `avg.Teambegeleiding` voor de ALLSTARS demo-club.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Lijst van ALLSTARS teams
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
