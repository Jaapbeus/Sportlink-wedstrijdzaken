  # ── Test ─────────────────────────────────────────────────────────────────────

  /test/email:
    post:
      tags: [beheer]
      operationId: testEmailDryRun
      summary: E-mailclassificatie dry-run
      description: |
        Simuleert de volledige e-mailverwerkingspipeline zonder iets te versturen of op te slaan.
        Geeft classificatie (AI), mogelijke planneractie, een voorbeeldantwoord en de beslissingstrace terug.
        Sinds #1568 deel C volgt de tester dezelfde stappen als productie: de gevalideerde leermomenten gaan als
        few-shot voorbeelden mee naar de classificatie (het aantal staat als trace-stap `leermomenten`) en de
        dry-run schrijft niets — alleen een nog lege teamlijst van de gekozen club wordt eenmalig opgebouwd.

        Rate limiting: max 10 aanroepen per minuut.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestEmailRequest'
      responses:
        '200':
          description: Dry-run resultaat
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEmailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Rate limit overschreden (max 10/minuut)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Feedback ─────────────────────────────────────────────────────────────────

  /feedback/validate:
    post:
      tags: [feedback]
      operationId: feedbackValidate
      summary: Feedback valideren op volledigheid
      description: |
        Controleert via GPT-4o-mini of de beschrijving voldoende informatie bevat.
        Geeft gerichte aanvulvragen terug als er gaten zijn.
        Open voor elke ingelogde rol (admin én user, #764). Per gebruiker begrensd: max 30 AI-aanroepen
        (validate + preview) per 10 minuten.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Validatieresultaat
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackValidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: AI-dienst niet beschikbaar (`IChatClient` niet geregistreerd — lokaal door de EgressGuard, #857). Body `{ error, aiBeschikbaar: false }`; er is niets verwerkt en geen AI-limietslot verbruikt (#1487)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /feedback/preview:
    post:
      tags: [feedback]
      operationId: feedbackPreview
      summary: Voorbeeld van het te publiceren issue opvragen
      description: |
        Stelt de exacte titel en body samen die bij publicatie naar GitHub zouden gaan, en geeft
        die terug **zonder** een issue aan te maken. Bedoeld om de beheerder te laten zien wat er
        openbaar op internet komt te staan, zodat hij daarna bewust kan bevestigen.

        Dezelfde controles als `/feedback/submit` draaien in dezelfde volgorde: de type-allowlist,
        de PII-gate op de verzamelde invoer en de PII-gate op de uiteindelijke titel/body. Een
        voorbeeld komt dus nooit door waar een publicatie zou afketsen.

        Per gebruiker begrensd (zie `/feedback/validate`) — er wordt niets gepubliceerd. Open voor
        elke ingelogde rol (#764).
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Voorbeeld van het te publiceren issue
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Mogelijke persoonsgegevens gedetecteerd in invoer of AI-output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AI-dienst niet beschikbaar (`IChatClient` niet geregistreerd — lokaal door de EgressGuard, #857). Body `{ error, aiBeschikbaar: false }`; er is niets verwerkt en geen AI-limietslot verbruikt (#1487)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /feedback/submit:
    post:
      tags: [feedback]
      operationId: feedbackSubmit
      summary: Feedback indienen (bewaren, en direct publiceren als beheerder)
      description: |
        Open voor elke ingelogde rol (#764). De melder (Entra object-ID, naam-momentopname, rol) komt
        uitsluitend uit het Easy Auth-principal en wordt bewaard in `avg.Feedback` — nooit in het
        publieke issue. Structureert de feedback met GPT-4o-mini en bewaart de te publiceren titel en body.

        * Rol **admin**: de melding wordt direct als GitHub-issue gepubliceerd (is GitHub niet
          geconfigureerd, dan blijft ze bewaard met een `waarschuwing`).
        * Rol **user**: de melding wacht (`status: wacht-op-publicatie`) tot een beheerder haar in het
          overzicht publiceert (`POST /beheer/feedback/{id}/publiceer`). De response bevat geen
          issueverwijzing.

        Is `bevestiging` meegestuurd — de velden zoals `/feedback/preview` ze teruggaf en de
        beheerder ze gezien heeft — dan wordt exact díe tekst gepubliceerd en volgt er géén nieuwe
        AI-aanroep. De PII-gate draait onverkort op de uiteindelijke titel en body.

        Limieten: max 3 meldingen per 10 minuten per gebruiker (gemeten in de database, dus gedeeld over
        instances) en een vangnet van 30 per uur voor de hele club.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: Melding bewaard (en bij een beheerder gepubliceerd)
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Mogelijke persoonsgegevens gedetecteerd in invoer of AI-output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limiet overschreden (per gebruiker of voor de hele club)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AI-dienst niet beschikbaar (`IChatClient` niet geregistreerd — lokaal door de EgressGuard, #857). Body `{ error, aiBeschikbaar: false }`; er is niets verwerkt en geen AI-limietslot verbruikt (#1487)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Bewaard, maar publiceren op GitHub is mislukt (alleen beheerder); opnieuw te publiceren via het overzicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Beheer — Feedbackoverzicht (#764) ────────────────────────────────────────

  /beheer/feedback:
    get:
      tags: [feedback]
      operationId: getFeedbackOverzicht
      summary: Feedbackmeldingen ophalen (overzicht)
      description: |
        Alle meldingen van de gekozen club (`X-Club-Code`), nieuwste eerst. Alleen rol `admin`: de naam
        van de melder is hier zichtbaar. **Elke aanroep wordt vastgelegd in het inzagelog**
        (`avg.FeedbackInzageLog`: wie, wanneer, welk filter — nooit de zoektekst). Geen export.
      security:
        - easyAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [Fout, Verzoek, Vraag]
        - name: status
          in: query
          schema:
            type: string
            enum: [wacht-op-publicatie, publiceren, gepubliceerd, github-mislukt]
        - name: vanaf
          in: query
          schema:
            type: string
            format: date
        - name: tot
          in: query
          description: Tot en met deze dag
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Zoekt (hoofdletterongevoelig, wildcards letterlijk) in onderwerp en beschrijving; max 100 tekens
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Meldingen
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/feedback/{id}:
    get:
      tags: [feedback]
      operationId: getFeedbackDetail
      summary: Eén feedbackmelding met technische context
      description: |
        Alleen rol `admin`. Wordt vastgelegd in het inzagelog (`actie: detail`).
      security:
        - easyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Melding
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/feedback/{id}/publiceer:
    post:
      tags: [feedback]
      operationId: publiceerFeedback
      summary: Een wachtende melding publiceren als GitHub-issue
      description: |
        Publiceert exact de bij het indienen voorbereide titel en body (de AI draait niet opnieuw);
        de PII-gate draait vlak vóór de GitHub-write nogmaals. Atomair geclaimd: een tweede klik
        maakt geen tweede issue (`409`). Alleen rol `admin`; wordt vastgelegd in het inzagelog
        (`actie: publiceer`).
      security:
        - easyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gepubliceerd
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPublishResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Al gepubliceerd, of wordt al gepubliceerd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Mogelijke persoonsgegevens gedetecteerd; niet gepubliceerd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Publiceren op GitHub mislukt; de melding blijft bewaard en is opnieuw te publiceren
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: GitHub-integratie niet geconfigureerd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /beheer/feedback/inzagelog:
    get:
      tags: [feedback]
      operationId: getFeedbackInzagelog
      summary: Inzagelog van het feedbackoverzicht
      description: |
        Wie het overzicht opende, een melding bekeek of publiceerde. Bevat nooit meldingsinhoud en
        wordt na 24 maanden gewist. Alleen rol `admin`.
      security:
        - easyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Inzageregels, nieuwste eerst
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackInzageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Beheer — Clubs ───────────────────────────────────────────────────────────

  /beheer/clubs:
    get:
      tags: [beheer]
      operationId: getClubs
      summary: Club-lijst ophalen (multi-club)
      description: |
        Geeft alle clubs uit `dbo.AppSettings`, gesorteerd op sync-status en naam.
        Gebruikt door de Blazor Admin UI voor de club-selector dropdown.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Lijst van clubs
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClubItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Beheer — Speeltijden ──────────────────────────────────────────────────────

  /beheer/speeltijden:
    get:
      tags: [beheer]
      operationId: getSpeeltijden
      summary: Speeltijden ophalen
      description: |
        Geeft speeltijdconfiguratie per leeftijdscategorie uit `dbo.Speeltijden`,
        gesorteerd op leeftijdscategorie (JO → MO → Gemengd → VR → Senioren).
      security:
        - easyAuth: []
      responses:
        '200':
          description: Lijst van speeltijden
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpeeltijdItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [beheer]
      operationId: createSpeeltijd
      summary: Speeltijd aanmaken
      description: |
        Voegt een nieuwe leeftijdscategorie toe aan `dbo.Speeltijden`.
        Geeft 409 Conflict terug als de leeftijdscategorie al bestaat voor de club.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeeltijdRequest'
      responses:
        '201':
          description: Speeltijd aangemaakt
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  Leeftijd:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Leeftijdscategorie bestaat al
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/speeltijden/{leeftijd}:
    put:
      tags: [beheer]
      operationId: updateSpeeltijd
      summary: Speeltijd bijwerken
      security:
        - easyAuth: []
      parameters:
        - name: leeftijd
          in: path
          required: true
          schema:
            type: string
          description: Leeftijdscategorie (bijv. JO13, MO17, VR)
          example: "JO13"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeeltijdRequest'
      responses:
        '200':
          description: Speeltijd bijgewerkt
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [beheer]
      operationId: deleteSpeeltijd
      summary: Speeltijd verwijderen
      security:
        - easyAuth: []
      parameters:
        - name: leeftijd
          in: path
          required: true
          schema:
            type: string
          example: "JO13"
      responses:
        '200':
          description: Speeltijd verwijderd
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Beheer — Theme ────────────────────────────────────────────────────────────

  /beheer/theme:
    get:
      tags: [beheer]
      operationId: getTheme
      summary: Club-thema ophalen
      description: |
        Geeft de huidige themakleuren, favicon-URL, logo-URL en de licht/donker-paletten uit
        `dbo.AppSettings` (Postgres-tier: `public.appsettings`).
        Geeft standaardwaarden terug als er nog geen thema is ingesteld; `lightColors`/`darkColors`
        zijn dan `null` en de client valt terug op de vier platte kleuren.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Thema-instellingen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [beheer]
      operationId: updateTheme
      summary: Club-thema opslaan
      description: |
        Slaat themakleuren, favicon-URL, logo-URL en de licht/donker-paletten op in
        `dbo.AppSettings` (Postgres-tier: `public.appsettings`).
        De vier platte kleurwaarden worden gevalideerd op `#rrggbb`. Elke sleutel en waarde in
        `lightColors`/`darkColors` wordt afzonderlijk gevalideerd; één ongeldige waarde wijst het
        hele verzoek af met HTTP 400.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeSaveRequest'
      responses:
        '200':
          description: Thema opgeslagen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/theme/extract:
    post:
      tags: [beheer]
      operationId: extractTheme
      summary: Kleuren extraheren uit club-website
      description: |
        Haalt de HTML van een club-website op en extraheert de meest voorkomende kleuren,
        de favicon-URL en de logo-URL (via og:image).

        **SSRF-bescherming:** privé-IP's (RFC1918, loopback, link-local) en DNS-fouten
        worden geblokkeerd.

        Rate-limit: afhankelijk van de beschikbaarheid van de externe website.
      security:
        - easyAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: URL van de club-website (http of https)
          example: "https://www.[clubdomein].nl"
      responses:
        '200':
          description: Geëxtraheerde kleuren en assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeExtractResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Club-website kon niet worden opgehaald
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Beheer — Leermomenten ─────────────────────────────────────────────────────

  /beheer/leermomenten:
    get:
      tags: [beheer]
      operationId: getLeermomenten
      summary: Classificatie-leermomenten ophalen
      description: |
        Geeft classificatie-correcties uit `planner.ClassificatieCorrectie`.
        Optioneel gefilterd op status.
      security:
        - easyAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, validated, rejected]
          description: "pending = onbeoordeeld, validated = gevalideerd, rejected = afgewezen. Leeg = alles."
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Maximum aantal terug te geven rijen
      responses:
        '200':
          description: Leermomenten
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeermomentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [beheer]
      operationId: createLeermoment
      summary: Leermoment toevoegen (beheerder)
      description: |
        Een leermoment door een beheerder (#1568 deel C): "dit bericht hoort een ander verzoektype te zijn".
        Direct gevalideerd, herkomst `Admin`, zonder reply-paar. De samenvatting wordt door dezelfde PII-arme
        sanering gehaald als de beslissingstrace. De aanmaker (object-ID + naammomentopname) komt uit het
        Easy Auth-principal, nooit uit de body. **Permanent**: de retentie raakt alleen herkomst `Reply`.
        Gevalideerde leermomenten gaan als few-shot voorbeeld mee naar de classificatie; admin-voorbeelden eerst
        binnen de limiet van 20.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeermomentAanmaakRequest'
      responses:
        '201':
          description: Leermoment opgeslagen
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    example: validated
                  herkomst:
                    type: string
                    example: Admin
                  samenvatting:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/leermomenten/stats:
    get:
      tags: [beheer]
      operationId: getLeermomentStats
      summary: Leermoment-statistieken ophalen
      description: Geeft tellingen per status (pending, validated, rejected) voor de club.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Statistieken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeermomentStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/leermomenten/{id}/valideer:
    put:
      tags: [beheer]
      operationId: valideerLeermoment
      summary: Leermoment valideren of afwijzen
      description: |
        Zet `IsGevalideerd` of `IsAfgewezen` op het leermoment.
        Actie `valideer` → leermoment wordt gebruikt voor AI-training.
        Actie `afwijzen` → leermoment wordt genegeerd.
      security:
        - easyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Leermoment ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValideerRequest'
      responses:
        '200':
          description: Actie uitgevoerd
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  actie:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Beheer — Teamaliassen ─────────────────────────────────────────────────────

  /beheer/teamaliassen:
    get:
      tags: [beheer]
      operationId: getTeamAliassen
      summary: Teamnaam-aliassen ophalen
      description: |
        Geeft de aliassen uit `dbo.TeamAliassen` van de club (`X-Club-Code`), samen met de
        canonieke teamnaam uit `dbo.Teams`. Optioneel gefilterd op status. Onbeoordeelde
        aliassen (`pending`) staan altijd bovenaan, daarna op aanmaakdatum aflopend.
        Bestaat de tabel nog niet, dan volgt een lege lijst in plaats van een fout.
      security:
        - easyAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, validated, rejected]
          description: "pending = onbeoordeeld, validated = goedgekeurd, rejected = afgewezen. Leeg = alles."
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
          description: Maximum aantal terug te geven rijen
      responses:
        '200':
          description: Teamaliassen
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAliasListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [beheer]
      operationId: createTeamAlias
      summary: Teamalias aanmaken (beheerder)
      description: |
        Koppelt een teamtekst aan een team (#1568 deel C): bron `CoordinatorCorrectie`, direct `validated`. De
        genormaliseerde sleutel komt uit `TeamNaamNormalisatie` (de enige normalisatieplek). Bestaat al een alias
        met dezelfde genormaliseerde tekst (of dezelfde ruwe tekst): voor hetzelfde team → `200` met status
        `bestaat-al` (een niet-gevalideerde alias wordt dan gevalideerd); voor een ander team → `409`, tenzij
        `herkoppel` expliciet `true` is (dan `200`, status `herkoppeld`). Een open regel in de wachtrij met
        onbekende teamteksten met dezelfde sleutel wordt automatisch `afgehandeld`. De aanmaker (object-ID +
        naammomentopname, geen e-mailadres) komt uit het Easy Auth-principal en wordt samen met de UTC-aanmaaktijd
        vastgelegd.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamAliasAanmaakRequest'
      responses:
        '200':
          description: Alias bestond al (`bestaat-al`) of is herkoppeld (`herkoppeld`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAliasAanmaakResponse'
        '201':
          description: Alias aangemaakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAliasAanmaakResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: De schrijfwijze hoort al bij een ander team en `herkoppel` was niet `true`
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  bestaandeAliasId:
                    type: integer
                  bestaandTeamId:
                    type: integer
                  bestaandTeamnaam:
                    type: string
                  bestaandeStatus:
                    type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/teamaliassen/{id}/valideer:
    put:
      tags: [beheer]
      operationId: valideerTeamAlias
      summary: Teamalias goedkeuren of afwijzen
      description: |
        Zet `Status` op de alias. `validated` → de alias geldt vanaf dat moment als vertrouwde
        exacte match bij teamnaam-resolutie. `rejected` → de alias wordt genegeerd. Wie (object-ID +
        naammomentopname) en wanneer (UTC) wordt vastgelegd (#1568 deel C).
      security:
        - easyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Alias-ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamAliasValideerRequest'
      responses:
        '200':
          description: Status bijgewerkt
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/teamaliassen/{id}:
    delete:
      tags: [beheer]
      operationId: deleteTeamAlias
      summary: Teamalias verwijderen
      description: |
        Verwijdert de alias definitief. Uitsluitend binnen de eigen club (`X-Club-Code`). Wie het deed staat
        (als pseudoniem) in het applicatielog; de tabel bewaart geen auditregel van een verwijderde rij.
        De alias kan opnieuw als `pending` verschijnen wanneer de schrijfwijze weer wordt
        aangetroffen.
      security:
        - easyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Alias-ID
      responses:
        '200':
          description: Verwijderd
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Beheer — Wachtrij onbekende teamteksten (#1568 deel C) ────────────────────

  /beheer/onbekende-teamteksten:
    get:
      tags: [beheer]
      operationId: getOnbekendeTeamTeksten
      summary: Wachtrij met onbekende teamteksten ophalen
      description: |
        Teamteksten uit binnengekomen e-mails die de pipeline niet aan een eigen team kon koppelen
        (trace-stap `team-herkenning` met uitkomst `Onopgelost` of `MeerdereKandidaten`). Open regels staan
        bovenaan. Koppelen gaat via `POST /beheer/teamaliassen`, dat de open regel zelf afhandelt. Regels die
        90 dagen niet meer zijn gezien worden door de wekelijkse e-mail-cleanup verwijderd.
      security:
        - easyAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, afgehandeld, genegeerd]
          description: Leeg = alles.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Wachtrij
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnbekendeTeamTekstListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/onbekende-teamteksten/{id}/status:
    put:
      tags: [beheer]
      operationId: zetOnbekendeTeamTekstStatus
      summary: Wachtrijregel afhandelen, negeren of heropenen
      security:
        - easyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnbekendeTeamTekstStatusRequest'
      responses:
        '200':
          description: Status bijgewerkt
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Beheer — Teambegeleiding ──────────────────────────────────────────────────

  /beheer/teambegeleiding:
    get:
      tags: [beheer]
      operationId: getTeambegeleidingTeams
      summary: Teams met beschikbare begeleiding ophalen
      description: |
        Geeft de unieke teamnamen waarvoor begeleiding (teamrollen) beschikbaar is
        in `avg.Teambegeleiding`.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Teamlijst
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["[ClubCode] JO11-1", "[ClubCode] JO13-2"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/teambegeleiding/{team}:
    get:
      tags: [beheer]
      operationId: getTeambegeleidingDetail
      summary: Begeleiding voor een specifiek team ophalen
      description: |
        Geeft Naam, Teamrol, Functie, Emailadres en Telefoonnummer voor de begeleidingsleden van het team.

        **AVG:** persoonsgegevens worden getoond aan elke ingelogde rol (admin + user) achter Entra
        ID auth — sinds #1330 bewust teruggedraaid uit de mei-2026-beperking (#310) die dit
        endpoint tijdelijk tot de admin-rol beperkte. E-mailadressen worden server-side gebruikt
        voor doorsturen — nooit opgenomen in auto-reply body.
      security:
        - easyAuth: []
      parameters:
        - name: team
          in: path
          required: true
          schema:
            type: string
          description: Teamnaam (exacte match)
          example: "[ClubCode] JO13-1"
      responses:
        '200':
          description: Begeleidingsleden voor het team
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeambegeleidingLid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/teambegeleiding/doorsturen:
    post:
      tags: [beheer]
      operationId: teambegeleiding doorsturen
      summary: Bericht doorsturen naar teambegeleiding
      description: |
        Stuurt een bericht door naar de begeleidingsleden van een team via e-mail.

        Standaard (`ontvangers` leeg) worden de e-mailadressen server-side opgezocht en staan ze
        nooit in de request body. Sinds #765 kan de aanroeper zelf de ontvangers opgeven via
        `ontvangers` — die worden dan server-side geparsed en gevalideerd (zie
        `TeambegeleidingDoorsturenRequest.ontvangers`). Elke verzending — automatisch opgezocht of
        zelf opgegeven — wordt weggeschreven als audit-rij in `planner.EmailVerwerking`
        (`VerzoekType='TeambegeleidingDoorsturen'`), zichtbaar via `GET /beheer/email-log` en na
        30 dagen geanonimiseerd door dezelfde cleanup als de reguliere e-mailpipeline.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeambegeleidingDoorsturenRequest'
      responses:
        '200':
          description: Bericht verstuurd
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  verstuurdNaar:
                    type: integer
                    description: Aantal ontvangers
        '400':
          description: |
            Ongeldige aanvraag. Naast de generieke validatie (team/bericht verplicht) geeft dit
            endpoint een 400 bij een ongeldig e-mailadres in `ontvangers` (met het foutieve fragment
            benoemd), meer dan 15 ontvangers, of een ontvanger die voorkomt op de uitsluitingslijst
            (`dbo.UitgeslotenEmailAdressen`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Geen begeleiding gevonden voor het opgegeven team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/teambegeleiding/import:
    post:
      tags: [beheer]
      operationId: importTeambegeleiding
      summary: Teambegeleiding importeren uit CSV
      description: |
        Importeert begeleidersgegevens uit een CSV-export van club.sportlink.com naar
        `avg.Teambegeleiding`. De bestaande rijen van de betrokken club worden vervangen: een
        club-scoped DELETE (nooit een TRUNCATE, dat zou andere clubs' rijen ook wissen), gevolgd
        door de nieuwe rijen en de audit-regel in `avg.ImportLog` — allemaal in één transactie met
        rollback bij elke fout (#1131/#1132). Kolomlengtes worden vóórdat er iets destructiefs
        gebeurt gevalideerd; een overtreding levert een `400` op en laat de vorige import ongemoeid.
        De Postgres-tier serialiseert bovendien vervangingen per club (`pg_advisory_xact_lock`), zodat
        twee gelijktijdige imports voor dezelfde club nooit tot een vereniging van beide batches
        kunnen leiden.

        **AVG:** de CSV-inhoud wordt in-memory verwerkt en nooit op schijf opgeslagen. De audit-regel
        in `avg.ImportLog` bevat alleen metadata (aantal rijen, bestandsnaam, duur) — geen
        persoonsgegevens.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeambegeleidingImportRequest'
      responses:
        '200':
          description: Import geslaagd
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeambegeleidingImportResultaat'
        '400':
          description: >-
            CSV ontbreekt, mist verplichte kolommen, of één of meer rijen overschrijden de
            maximale kolomlengte (#1131) — in dat laatste geval is de vorige import niet gewijzigd.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  ontbreekt:
                    type: array
                    description: Namen van de ontbrekende verplichte kolommen
                    items:
                      type: string
                  fouten:
                    type: array
                    description: >-
                      Bij een kolomlengte-overtreding: één omschrijving per rij/kolom, bijv.
                      "Rij 3, kolom 'Team': 101 tekens (maximaal 100)."
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Testdata ──────────────────────────────────────────────────────────────────

  /beheer/testdata/wedstrijden/verplaats-datum:
    post:
      tags: [testdata]
      operationId: verplaatsTestDataDatum
      summary: ALLSTARS-testwedstrijden naar een andere datum verplaatsen
      description: |
        Verplaatst alle wedstrijden van de ALLSTARS demo-club van `oudeDatum` naar `nieuweDatum`.
        Raakt uitsluitend rijen met `ClubCode = 'ALLSTARS'` — productiedata blijft ongemoeid.
        Bedoeld om demodata mee te laten schuiven met het actuele seizoen.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerplaatsDatumRequest'
      responses:
        '200':
          description: Wedstrijden verplaatst
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  aantalVerplaatst:
                    type: integer
                    description: Aantal bijgewerkte wedstrijden
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/testdata/wedstrijden:
    get:
      tags: [testdata]
      operationId: getTestDataWedstrijden
      summary: Test-wedstrijden ophalen (ALLSTARS)
      description: |
        Geeft wedstrijden uit `his.matches` voor de ALLSTARS demo-club.
        Alleen beschikbaar in lokale/staging-omgevingen.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Lijst van test-wedstrijden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestDataWedstrijd'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [testdata]
      operationId: createTestDataWedstrijd
      summary: Test-wedstrijd aanmaken (ALLSTARS)
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestDataWedstrijdCreateRequest'
      responses:
        '200':
          description: Test-wedstrijd aangemaakt
          content:
            application/json:
              schema:
                type: object
                properties:
                  bk:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [testdata]
      operationId: deleteAllTestDataWedstrijden
      summary: Alle test-wedstrijden verwijderen (ALLSTARS)
      description: Verwijdert alle wedstrijden van de ALLSTARS demo-club uit `his.matches`.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Alle test-wedstrijden verwijderd
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    description: Aantal verwijderde rijen
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/testdata/wedstrijden/{bk}:
    delete:
