        datum:
          type: string
          format: date
          example: "2026-06-07"
        aanvangstijd:
          type: string
          example: "10:00"
        thuisteam:
          type: string
          example: "AllStars FC JO11-1"
        uitteam:
          type: string
          example: "Tegenstander JO11-2"
        veld:
          type: string
          nullable: true
          example: "veld 3"
        competitiesoort:
          type: string
          nullable: true
          example: "Oefenwedstrijd"
        veld_subpositie:
          type: string
          nullable: true

    # ── Planner — Auto-plan ───────────────────────────────────────────────────

    AutoPlanRequest:
      type: object
      required:
        - datum
      properties:
        datum:
          type: string
          format: date
          description: Datum voor de automatische planning
          example: "2026-06-07"
        doel:
          type: string
          nullable: true
          description: Optioneel optimalisatiedoel

    AutoPlanWedstrijd:
      type: object
      properties:
        wedstrijdCode:
          type: integer
          format: int64
          nullable: true
        wedstrijd:
          type: string
          description: Volledige wedstrijdomschrijving zoals in Sportlink
        teamNaam:
          type: string
        leeftijdsCategorie:
          type: string
          nullable: true
        competitiesoort:
          type: string
          nullable: true
        duurMinuten:
          type: integer
        veldafmeting:
          type: number
          format: decimal
        huidigeVeld:
          type: string
          nullable: true
        huidigeTijd:
          type: string
          nullable: true
        heeftVeld:
          type: boolean
        heeftTijd:
          type: boolean
        optimaalVeldNummer:
          type: integer
          nullable: true
        optimaalVeldNaam:
          type: string
          nullable: true
        optimaalVeld:
          type: string
          nullable: true
          description: Veld in Sportlink-formaat, eventueel met subpositie ("veld 3 A")
          example: "veld 3 A"
        optimaalTijd:
          type: string
          nullable: true
          example: "11:15"
        status:
          type: string
          description: |
            Verplaatst de planner deze wedstrijd t.o.v. de huidige stand? Zegt niets over de
            voorkeurstijd — daarvoor is `voorkeurStatus` (#666).
          enum: [ongewijzigd, wijziging, nieuw-slot, niet-inplanbaar, onbekend-team]
        nietInplanbaaarReden:
          type: string
          nullable: true
        voorkeurTijd:
          type: string
          nullable: true
          description: Streeftijd waarop is ingepland; null als er geen voorkeur en geen leeftijdsdefault is
          example: "11:00"
        voorkeurAfwijkingMinuten:
          type: integer
          nullable: true
          description: 0 = exact op de voorkeurstijd, positief = later, negatief = eerder
        voorkeurBron:
          type: string
          nullable: true
          description: |
            Uit welke laag van de rangorde de streeftijd komt (#666):
            `regel` = teamregel VoorkeurVeld met tijd, `team` = dbo.TeamVoorkeurTijden,
            `leeftijd` = dbo.Speeltijden.StandaardVoorkeurTijd.
          enum: [regel, team, leeftijd]
        voorkeurStatus:
          type: string
          description: Beoordeling van de afwijking, met dezelfde drempels als de Gantt-legenda
          enum: [op-tijd, kleine-afwijking, grote-afwijking, geen-voorkeur]
        voorkeurVeldNummer:
          type: integer
          nullable: true
          description: Voorkeursveld uit een teamregel; null als die regel er niet is
        voorkeurVeldToegepast:
          type: boolean
          nullable: true
          description: false als er een voorkeursveld was maar de planner een ander veld moest kiezen
        teamBufferVoor:
          type: integer
          nullable: true
          description: |
            Actieve teamregel BufferVoor in minuten (#1430); null = geen regel. Ruwe waarde: de
            effectieve buffer is het maximum van deze waarde en de algemene buffer. De Admin GUI
            gebruikt hem om na handmatig verslepen dezelfde bufferregel toe te passen als de planner.
        teamBufferNa:
          type: integer
          nullable: true
          description: Actieve teamregel BufferNa in minuten (#1430); null = geen regel. Zie teamBufferVoor.

    VeldbezettingItem:
      type: object
      description: |
        Lichtgewicht projectie van een geplande wedstrijd — zonder scheduling-optimalisatie,
        alleen wat er nu al in Sportlink gepland staat.
      properties:
        wedstrijdCode:
          type: integer
          format: int64
          nullable: true
        wedstrijd:
          type: string
        teamNaam:
          type: string
        uitteam:
          type: string
          nullable: true
        aanvangsTijd:
          type: string
          nullable: true
          example: "13:00"
        veld:
          type: string
          nullable: true
        competitiesoort:
          type: string
          nullable: true
        leeftijdsCategorie:
          type: string
          nullable: true
        duurMinuten:
          type: integer
          description: Wedstrijdduur in minuten uit de speeltijden-configuratie (0 = onbekende leeftijdscategorie)
        veldafmeting:
          type: number
          format: decimal
          description: Aandeel van een heel veld dat deze wedstrijd gebruikt (1.00 = heel veld)

    AutoPlanResponse:
      type: object
      properties:
        datum:
          type: string
          format: date
        aantalWedstrijden:
          type: integer
        suggesties:
          type: array
          items:
            $ref: '#/components/schemas/AutoPlanWedstrijd'
        waarschuwingen:
          type: array
          items:
            type: string

    AutoPlanToepassenRequest:
      type: object
      required:
        - datum
      properties:
        datum:
          type: string
          format: date
          example: "2026-06-07"
        bevestigingsToken:
          type: string
          nullable: true
          description: Token uit AutoPlanResponse ter verificatie

    AutoPlanToepassenResponse:
      type: object
      properties:
        datum:
          type: string
          format: date
        toegepast:
          type: integer
          description: Aantal wedstrijden waarvoor een slot is geboekt
        overgeslagen:
          type: integer
          description: Aantal wedstrijden waarvoor geen slot beschikbaar was
        waarschuwingen:
          type: array
          items:
            type: string

# =============================================================================
# Paden
# =============================================================================
paths:

  # ── Core ────────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [core]
      operationId: getHealth
      summary: Status en versie van de API
      description: |
        Geeft de actuele status en assemblyversie terug. Geen authenticatie vereist.

        `tier` en `provider` komen uit build-time metadata van het artefact (niet uit een
        runtime-gok) en zijn daarom altijd gevuld, ook als `database` niet "online" is.
        `serverVersion` komt aantoonbaar uit de database zelf en is alleen gevuld wanneer
        `database` "online" is (#863).

        `database: "unconfigured"` (geen bruikbare connectiereeks) geeft 503, niet 200 (#859).
        Elke andere waarde (ook de tijdelijke toestanden paused/timeout/unavailable) blijft 200
        met `status: "degraded"`.
      security: []
      responses:
        '200':
          description: API is beschikbaar (database online, of een tijdelijke, niet-configuratie-gerelateerde toestand)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Geen bruikbare connectiereeks geconfigureerd (#859)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /postgres/sync-matches:
    get:
      tags: [core]
      operationId: syncMatchesPostgres
      summary: Handmatige Sportlink synchronisatie starten (Postgres-tier)
      description: |
        **Tier: Postgres (productie).** Op de SQL Server-tier bestaat deze route niet (404) — daar
        heet hij `/sync-matches`.

        Start een Sportlink API-synchronisatie (teams, wedstrijden, wedstrijddetails).
        Vereist een Entra ID Bearer token met de `admin`-rol (#1350; tot dan de Azure Master key
        via `?code=`, `AuthorizationLevel.Admin`).

        - **Standaard**: vorige week t/m einde seizoen (weekOffset -1 tot seizoenEinde)
        - **Reset-modus**: `?reset=true&season=YYYY` — volledig seizoen vanaf startjaar.
          Een ontbrekende of onparseerbare `season` valt stil terug op de standaardmodus.

        Mislukt één of meer deelstappen, dan volgt `207` in plaats van `200`: de geslaagde
        deelstappen blijven staan, maar `lastsynctimestamp` wordt bewust niet bijgewerkt (#1081).
      security:
        - easyAuth: []
      parameters:
        - name: reset
          in: query
          required: false
          schema:
            type: boolean
          description: true = volledig seizoen synchroniseren i.p.v. incrementeel
        - name: season
          in: query
          required: false
          schema:
            type: integer
            example: 2025
          description: Startjaar seizoen (bijv. 2025 = seizoen 2025/2026). Gebruik samen met reset=true.
      responses:
        '200':
          description: Synchronisatie voltooid
          content:
            application/json:
              schema:
                type: string
                example: "Sync voltooid. WeekOffset-bereik: -1 tot 42."
        '207':
          description: |
            Gedeeltelijk mislukt — één of meer deelstappen zijn niet geslaagd en
            `lastsynctimestamp` is niet bijgewerkt (#1081).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "gedeeltelijk mislukt"
                  weekOffsetFrom:
                    type: integer
                    example: -1
                  weekOffsetTo:
                    type: integer
                    example: 42
                  melding:
                    type: string
                    example: "Eén of meer deelstappen zijn mislukt; lastsynctimestamp is niet bijgewerkt. Zie het functielog voor de betrokken fase(s)."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sync-matches:
    get:
      tags: [core]
      operationId: syncMatches
      summary: Handmatige Sportlink synchronisatie starten (SQL Server-tier)
      description: |
        **Tier: SQL Server.** Op de Postgres-tier (productie) bestaat deze route niet (404) — daar
        heet hij `/postgres/sync-matches`.

        Start een volledige Sportlink API-synchronisatie (teams, wedstrijden, wedstrijddetails).
        Vereist een Entra ID Bearer token met de `admin`-rol (#1350; tot dan de Azure Master key
        via `?code=`, `AuthorizationLevel.Admin`).

        - **Standaard**: vorige week t/m einde seizoen (weekOffset -1 tot seizoenEinde)
        - **Reset-modus**: `?reset=true&season=YYYY` — volledig seizoen vanaf startjaar

        Deze tier kent de `207`-respons van de Postgres-tier niet: alleen `200` of `500`.
      security:
        - easyAuth: []
      parameters:
        - name: reset
          in: query
          required: false
          schema:
            type: boolean
          description: true = volledig seizoen synchroniseren i.p.v. incrementeel
        - name: season
          in: query
          required: false
          schema:
            type: integer
            example: 2025
          description: Startjaar seizoen (bijv. 2025 = seizoen 2025/2026). Gebruik samen met reset=true.
      responses:
        '200':
          description: Synchronisatie voltooid
          content:
            application/json:
              schema:
                type: string
                example: "Sync completed. WeekOffset range: -1 to 42."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Planner ─────────────────────────────────────────────────────────────────

  /planner/check-availability:
    post:
      tags: [planner]
      operationId: checkAvailability
      summary: Veldbeschikbaarheid controleren
      description: |
        Controleer of een veld beschikbaar is voor een (oefen)wedstrijd.

        Drie modi:
        1. **Slot toewijzen** — `leeftijdsCategorie` opgegeven: zoekt beste beschikbare slot
        2. **Alternatieven** — gevraagd tijdstip bezet: geeft tot 3 alternatieven terug
        3. **Vrije vensters** — geen `leeftijdsCategorie`: geeft alle open tijdvensters per veld

        Controleert ook teamconflicten als `teamNaam` opgegeven is.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAvailabilityRequest'
      responses:
        '200':
          description: Beschikbaarheidsresultaat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/bevestig:
    post:
      tags: [planner]
      operationId: bevestigWedstrijd
      summary: Wedstrijdslot boeken
      description: |
        Bevestigt en boekt een wedstrijdslot. Schrijft naar `planner.GeplandeWedstrijden`.
        Status wordt altijd als `"Te bevestigen"` aangemaakt.

        Server-side gevalideerd (#1134): de wedstrijdduur moet positief zijn en binnen de dag
        blijven (400 anders), en de aanvraag wordt atomair tegen de bestaande bezetting getoetst
        vóór opslag — een overlappend interval geeft 409 in plaats van een stille dubbele boeking.
        Twee reserveringen die elkaar precies aanraken (bijv. 10:00–11:00 gevolgd door 11:00–12:00)
        zijn GEEN conflict.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BevestigRequest'
      responses:
        '200':
          description: Wedstrijd geboekt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BevestigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Bezettingsconflict — het veld is op dit tijdstip al (gedeeltelijk) bezet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BevestigConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/populate-sunset:
    post:
      tags: [planner]
      operationId: populateSunset
      summary: Zonsondergangtabel vullen
      description: |
        Vult de `DateTable` met NOAA-berekende zonsondergangtijden voor het accommodatiecoördinaat.
        Eenmalig uitvoeren na initiële setup, of wanneer het seizoen/datumbereik wordt uitgebreid.
        Vereist een Entra ID Bearer token met de `admin`-rol — géén Master key.
      security:
        - easyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Tabel gevuld
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Sunset data populated from 2026-01-01 to 2027-12-31."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/zoek-wedstrijd:
    post:
      tags: [planner]
      operationId: zoekWedstrijd
      summary: Bestaande wedstrijd opzoeken
      description: |
        Zoek een bestaande competitiewedstrijd op basis van teamnaam en datum.
        Gedeeltelijke teamnaam-match is ondersteund.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoekWedstrijdRequest'
      responses:
        '200':
          description: Zoekresultaat (gevonden of niet gevonden)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      gevonden:
                        type: boolean
                        example: true
                      wedstrijd:
                        $ref: '#/components/schemas/WedstrijdSamenvatting'
                  - type: object
                    properties:
                      gevonden:
                        type: boolean
                        example: false
                      reden:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/herplan-check:
    post:
      tags: [planner]
      operationId: herplanCheck
      summary: Herplan-alternatieven simuleren
      description: |
        Berekent alternatieve tijdsloten voor een bestaande wedstrijd.
        **Voert niets door** — puur simulatie waarbij het huidige slot als vrij wordt beschouwd.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HerplanCheckRequest'
      responses:
        '200':
          description: Herplan-alternatieven
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HerplanCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/herplan-bevestig:
    post:
      tags: [planner]
      operationId: herplanBevestig
      summary: Herplanverzoek registreren
      description: |
        Registreert een herplanverzoek met status `"Aangevraagd"`.
        **Wijzigt de wedstrijd niet** — de feitelijke aanpassing in Sportlink is een handmatig proces.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HerplanBevestigRequest'
      responses:
        '200':
          description: Herplanverzoek geregistreerd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HerplanBevestigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/doordeweeks-beschikbaar:
    post:
      tags: [planner]
      operationId: doordeweeksBeschikbaar
      summary: Doordeweekse beschikbaarheid opvragen
      description: |
        Geeft beschikbare doordeweekse avondsloten (ma–do) t/m het einde van het seizoen.
        Optioneel gefilterd op dag en duur/leeftijdscategorie.
      security:
        - easyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoordeweeksBeschikbaarRequest'
      responses:
        '200':
          description: Beschikbare doordeweekse datums
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoordeweeksBeschikbaarResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /planner/team-schedule:
    get:
      tags: [planner]
      operationId: getTeamSchedule
      summary: Teamschema ophalen
      description: |
        Geeft alle wedstrijden voor een team t/m het seizoenseinde, inclusief een overzicht per
        zaterdag (vrij / oefenwedstrijd / bezet).

        Optioneel `?format=html` voor een HTML-weergave.
      security:
        - easyAuth: []
      parameters:
        - name: team
          in: query
          required: true
          schema:
            type: string
          description: Exacte teamnaam
          example: "[ClubCode] JO13-1"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [html]
          description: html = HTML-weergave teruggeven i.p.v. JSON
      responses:
        '200':
          description: Teamschema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamScheduleResponse'
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ── Beheer ───────────────────────────────────────────────────────────────────

  /beheer/settings:
    get:
      tags: [beheer]
      operationId: getSettings
      summary: Club-instellingen ophalen
      description: |
        Leest niet-gevoelige AppSettings velden. SportlinkClientId en geheimen worden nooit
        teruggegeven. Voegt een leesbare CRON-preview toe als FetchSchedule aanwezig is.
      security:
        - easyAuth: []
      responses:
        '200':
          description: AppSettings
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Geen AppSettings-rij gevonden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [beheer]
      operationId: updateSettings
      summary: Club-instellingen bijwerken
      description: |
        Werkt toegestane AppSettings-velden bij en schrijft een audit-regel naar `dbo.AppSettingsAudit`.
        Bij wijziging van `FetchSchedule` herstart de Function App automatisch (als Azure Management API
        geconfigureerd is). Velden buiten de witte lijst worden genegeerd.
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Instellingen opgeslagen
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/rolfeatureinstellingen:
    get:
      tags: [beheer]
      operationId: getRolFeatureInstellingen
      summary: Volledige toegangsmatrix per rol ophalen (#1390, opvolger van #1341/epic #1338)
      description: |
        Toont voor elke instelbare rol (`user`, `Wedstrijdzaken`, `Sectiehoofd`,
        `Ledenadministratie`) bij deze club de huidige stand van elke functie: de drie
        Sportlink-mutatieacties (kleedkamers/scheidsrechter/veld) én de menu-zichtbaarheid van elk
        Admin GUI-scherm. `admin` heeft dit altijd aan en komt hier niet in voor — alleen de vier
        instelbare rollen. Fail-closed: een niet-teruggegeven combinatie betekent uitgeschakeld.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Volledige matrix — elke rol × functie-combinatie met huidige stand
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolFeatureInstellingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [beheer]
      operationId: zetRolFeatureInstelling
      summary: Eén cel van de toegangsmatrix wijzigen (#1390, opvolger van #1341/epic #1338)
      description: |
        Zet één rol × functie-combinatie aan/uit bij deze club. Voor de drie Sportlink-
        mutatieacties (`sportlink.kleedkamers`, `sportlink.scheidsrechter`, `sportlink.veld`) is
        dit de server-side leidende controle: `SportlinkMatchFunction` wijst een uitgeschakelde
        actie ook af als de UI-toggle omzeild wordt. Voor de overige (`menu.*`) FeatureKeys legt
        dit endpoint vandaag uitsluitend configuratie vast — er is nog geen server-side handhaving
        van menu-zichtbaarheid (zie `docs/SPORTLINK-WEB-EXTENSION.md` §3.5).
      security:
        - easyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [RolNaam, FeatureKey, Enabled]
              properties:
                RolNaam:
                  type: string
                  enum: [user, Wedstrijdzaken, Sectiehoofd, Ledenadministratie]
                FeatureKey:
                  type: string
                  enum:
                    - sportlink.kleedkamers
                    - sportlink.scheidsrechter
                    - sportlink.veld
                    - menu.dashboard
                    - menu.teambegeleiding
                    - menu.planning
                    - menu.veldoptimalisatie
                    - menu.leermomenten
                    - menu.teamaliassen
                    - menu.emailtester
                    - menu.wijzigingsverzoeken
                    - menu.wedstrijdaanmaken
                    - menu.instellingen.speeltijden
                    - menu.instellingen.velden
                    - menu.instellingen.begeleidingimport
                    - menu.instellingen.voorkeurstijden
                    - menu.instellingen.emailtemplates
                    - menu.instellingen.thema
                    - menu.instellingen.sportlinkextensie
                Enabled:
                  type: boolean
      responses:
        '200':
          description: Instelling opgeslagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolFeatureInstellingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/sportlink-extensie/rollen:
    get:
      tags: [beheer]
      operationId: getSportlinkExtensieRollen
      summary: Rol↔serviceaccount-koppelingsstatus (Sportlink Web Extension)
      description: |
        Toont per functionele rol (bv. "Wedstrijdzaken", epic #986/#988) of er een eigen,
        smal-geschaald Sportlink-serviceaccount gekoppeld is, en wie/wanneer dat laatst
        registreerde. Geen live Sportlink-verificatie.
      security:
        - easyAuth: []
      responses:
        '200':
          description: Lijst van rollen met koppelingsstatus
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportlinkExtensieRolResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /beheer/sportlink-extensie/rollen/{rolNaam}:
    put:
      tags: [beheer]
      operationId: registreerSportlinkExtensieRol
