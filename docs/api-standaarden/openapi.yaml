  /beheer/sportlink-extensie/health:
    get:
      tags: [beheer]
      operationId: getSportlinkExtensieHealth
      summary: Statussectie Sportlink Web Extension (#998, epic #986)
      description: |
        Zonder `live=true` (default) doet dit endpoint GEEN Sportlink-aanroep — alles komt uit
        onze eigen database (extension/dry-run-instelling, EgressGuard-status, koppeling +
        laatste tokenverversing per rol, laatste mutatiefout, laatste contract-check). Alleen bij
        expliciete `?live=true` (gebruikersklik "Nu live controleren") doet het één
        tokenverversing en één leesaanroep — en rapporteert dan uitsluitend HTTP-status/
        resultaataard, nooit responsdata.
      security:
        - easyAuth: []
      parameters:
        - name: live
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Statusoverzicht
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportlinkExtensieHealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "live=true opgegeven terwijl de extension uitstaat"
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: "live=true opgegeven terwijl uitgaande integraties niet zijn toegestaan (EgressGuard), of de Sportlink-client niet geconfigureerd is"

  /sportlink/match/{wedstrijdcode}:
    get:
      tags: [sportlink]
      operationId: getSportlinkMatch
      summary: Read-only wedstrijdgegevens uit Sportlink Club (#991, epic #986)
      description: |
        Zoekt het `PublicMatchId` van deze wedstrijd op (gecached, zie
        `public.sportlinkpublicmatchidcache`; reverse-lookup bij Sportlink zelf bij een cache-miss
        — #987) en haalt daarmee het wedstrijdobject op bij Sportlink Club. Uitsluitend lezen —
        geen enkele mutatie. Vereist sinds #1400 alleen `admin` óf `user` (voorheen uitsluitend
        `Wedstrijdzaken`/`admin`, zie #988 Besluit 1) en dat `SportlinkExtensionEnabled` aan staat.
        Welke permissievlaggen en relatiecodes in de respons daadwerkelijk gevuld zijn hangt af van
        de éigen rol van de aanroeper (`admin`/`Wedstrijdzaken` → echte waarden, gewone `user` →
        alles `false`/`null`, zie `SportlinkRolFeatureToestemmingen.MagWijzigen`). Bevat sinds #1340
        (VOORSTEL, DPO-vraag nog niet bevestigd — zie docs/SPORTLINK-WEB-EXTENSION.md §8) ook de
        relatiecode van scheidsrechter/AR1/AR2 als PRECIES ÉÉN uitzondering op "verder
        niet-persoonsgebonden" — nooit een naam of ander persoonsgegeven.
      security:
        - easyAuth: []
      parameters:
        - name: wedstrijdcode
          in: path
          required: true
          schema:
            type: string
          description: Onze eigen wedstrijdcode (his.matches), niet Sportlinks PublicMatchId.
      responses:
        '200':
          description: Wedstrijdgegevens
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportlinkMatchInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Wedstrijd, PublicMatchId of Sportlink-match niet gevonden
        '409':
          description: Extension staat uit, of de Sportlink-koppeling ontbreekt/is verlopen
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

  /sportlink/match/{wedstrijdcode}/public-match-id:
    get:
      tags: [sportlink]
      operationId: getSportlinkPublicMatchId
      summary: PublicMatchId opzoeken voor de deep-link-knop (#989, epic #986)
      description: |
        Lichtgewicht variant van `/sportlink/match/{wedstrijdcode}`: zoekt uitsluitend het
        `PublicMatchId` op (gecached, zie `public.sportlinkpublicmatchidcache`; reverse-lookup bij
        Sportlink zelf bij een cache-miss — #987/#1016) zonder de volledige `Match`-aanroep bij
        Sportlink te doen. Gebruikt door de "Open in Sportlink"-knop in Dagplanning om
        `https://club.sportlink.com/competition-affairs/match-details/{PublicMatchId}` te openen.
        Vereist sinds #1400 alleen `admin` óf `user` (voorheen uitsluitend `Wedstrijdzaken`/`admin`).
      security:
        - easyAuth: []
      parameters:
        - name: wedstrijdcode
          in: path
          required: true
          schema:
            type: string
          description: Onze eigen wedstrijdcode (his.matches), niet Sportlinks PublicMatchId.
      responses:
        '200':
          description: PublicMatchId
          headers:
            x-correlation-id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  PublicMatchId:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Wedstrijd niet gevonden, of nog niet bekend bij Sportlink voor deze datum
        '409':
          description: Extension staat uit, of de Sportlink-koppeling ontbreekt/is verlopen
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

  /sportlink/match/{wedstrijdcode}/dressingrooms:
    put:
      tags: [sportlink]
      operationId: putSportlinkDressingRooms
      summary: Kleedkamers toewijzen (#992, epic #986) — eerste echte Sportlink-mutatie
      description: |
        Resolvet PublicMatchId, controleert `SportlinkMutationGuard` (IsHomeMatch +
        IsAssignDressingRoomsAllowed), logt de poging vóór en na in
        `public.sportlinkmutationaudit`, en voert dan `PUT UpdateMatchDressingRooms` uit bij
        Sportlink Club. Retourneert HTTP 200 ook als Sportlink de mutatie inhoudelijk afwijst
        (`IsSuccess=false` + `Violations`) — dat is geen transportfout.
      security:
        - easyAuth: []
      parameters:
        - name: wedstrijdcode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                HomeDressingRoomId: { type: string, nullable: true }
                AwayDressingRoomId: { type: string, nullable: true }
                OfficialDressingRoomId: { type: string, nullable: true }
      responses:
        '200':
          description: Mutatieresultaat (IsSuccess kan alsnog false zijn)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportlinkMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Wedstrijd of PublicMatchId niet gevonden
        '409':
          description: |
            Extension staat uit, koppeling ontbreekt/verlopen, guardrail geblokkeerd, of (#1341)
            "Kleedkamers toewijzen" staat uit voor de Wedstrijdzaken-rol bij deze club.
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Sportlink gaf geen bruikbare respons
        '504':
          description: Sportlink reageerde niet op tijd. De mutatie is bewust NIET automatisch herhaald — de uitkomst bij Sportlink is onbekend; controleer eerst in Sportlink of de actie al is doorgevoerd (#1387, #1417)
        '503':
          description: Uitgaande integraties staan hier niet toe (EgressGuard)

