openapi: 3.0.3
info:
  title: Sportlink Wedstrijdzaken API
  description: |
    API voor het beheer van wedstrijden, veldplanning en club-instellingen.

    ## Beveiliging

    Eén beveiligingsschema:

    - **easyAuth** — Azure Easy Auth Bearer token (Entra ID) in de `Authorization`-header, vereist
      voor alle endpoints behalve `/health`. De rolcontrole gebeurt server-side, met vier niveaus:
      `admin` (`EasyAuthHelper.RequireAdmin`, via de wrappers `AdminEndpoint.ExecuteAsync` /
      `ExecuteZonderDatabaseAsync`) voor de meeste `/beheer/`-, `/planner/`- en
      `/test/`-endpoints (waaronder het feedbackoverzicht `/beheer/feedback`) — sinds #1350 óók voor `/postgres/sync-matches` en `/sync-matches`;
      `admin` óf `user` (`AdminEndpoint.ExecuteAuthenticatedAsync`, #1330) voor `/planner/veldbezetting`
      (#1400), de drie `/feedback/`-endpoints (#764: elke ingelogde gebruiker mag feedback geven), de twee Sportlink-viewing-endpoints (`GET /sportlink/match/{wedstrijdcode}` en
      `.../public-match-id`, #1400) en de drie Teambegeleiding-lookup/doorstuur-endpoints; op
      **beide** tiers identiek `Wedstrijdzaken` óf `admin` (`EasyAuthHelper.RequireWedstrijdzaken`,
      beide poorten sinds #1400) voor de Sportlink-mutatie-endpoints (`PUT`/`POST` onder
      `/sportlink/`), via `SportlinkEndpointSupport.ExecuteWedstrijdzakenAsync`. Netto: een gewone
      `user` (zonder `Wedstrijdzaken`, zonder `admin`) kan Planning en het Sportlink-paneel bekijken
      maar geen Sportlink-mutatie triggeren; dat laatste vereist `Wedstrijdzaken` óf `admin`. Lokaal
      omzeild wanneer de omgevingsvariabele `WEBSITE_SITE_NAME` afwezig is.

    Zonder token volgt `401`. Met een geldig token maar zonder de vereiste rol volgt `403` met
    `{ "error": "Forbidden: vereiste rol ontbreekt" }`.

    ## Tiers

    Alle endpoints bestaan sinds #1266 op beide databasetiers, met één uitzondering: de handmatige
    synchronisatie heet `/postgres/sync-matches` op de Postgres-tier (productie) en
    `/sync-matches` op de SQL Server-tier. Op de andere tier geeft die route `404`.

    Alle `/beheer/`- en `/feedback/`-endpoints retourneren de header `x-correlation-id` in het antwoord.
  version: 3.11.2.0
  contact:
    name: Sportlink Wedstrijdzaken
    url: https://github.com/jaapbeus/Sportlink-wedstrijdzaken

servers:
  - url: https://func-{clubcode}-sportlink.azurewebsites.net/api
    description: Productie (Azure Functions — vervang {clubcode} door de clubcode van jouw installatie)
  - url: http://localhost:7094/api
    description: Lokale ontwikkeling (func start)

tags:
  - name: core
    description: |
      Health (anoniem) en handmatige Sportlink-synchronisatie (Entra ID, admin-rol — sinds #1350
      geen Master key meer).
      De syncroute verschilt per tier: /postgres/sync-matches (Postgres) of /sync-matches (SQL Server).
  - name: planner
    description: Veldplanning, beschikbaarheidscontrole en dagplanning (vereist Entra ID authenticatie met admin-rol)
  - name: beheer
    description: Beheerfuncties (vereisen Entra ID authenticatie met admin-rol)
  - name: testdata
    description: Testdata beheer voor ALLSTARS demo-club (vereist admin-rol)
  - name: feedback
    description: |
      Feedback widget (#764): voor elke ingelogde gebruiker (rol admin of user). Het beheeroverzicht
      onder /beheer/feedback is alleen voor de admin-rol. Zie docs/FEEDBACK.md.
  - name: sportlink
    description: |
      Sportlink Web Extension (#986/#991) — lees- én mutatie-endpoints. Sinds #1400: de twee
      viewing-endpoints (`GET /sportlink/match/{wedstrijdcode}` en `.../public-match-id`) vereisen
      alleen `admin` óf `user`; de mutatie-endpoints (`PUT`/`POST`) vereisen op beide tiers identiek
      `Wedstrijdzaken` óf `admin` — zie de beveiligingsparagraaf hierboven.
      Verschillende mutaties zijn in de code op dry-run vastgezet — zie docs/SPORTLINK-WEB-EXTENSION.md.

# ─────────────────────────────────────────────────────────────────────────────
# Beveiligingsschema's
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    easyAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Azure Easy Auth Bearer token (Entra ID). Geldt voor alle endpoints behalve `/health`,
        inclusief `/postgres/sync-matches` en `/sync-matches` (sinds #1350 — tot dan een Function
        key/Master key via `?code=`). De Function App valideert dit token via Easy Auth en
        injecteert `X-MS-CLIENT-PRINCIPAL`. EasyAuthHelper controleert daarna de rol: `admin` op de
        meeste /beheer/-, /planner/-, /feedback/- en /test/-endpoints (en de twee syncroutes);
        `admin` of `user` op /planner/veldbezetting en de twee Sportlink-viewing-endpoints (#1400);
        `Wedstrijdzaken` of `admin` op de Sportlink-mutatie-endpoints (beide poorten sinds #1400).
        Lokaal altijd toegestaan als WEBSITE_SITE_NAME afwezig is.

  # ───────────────────────────────────────────────────────────────────────────
  # Herbruikbare headers
  # ───────────────────────────────────────────────────────────────────────────
  headers:
    CorrelationId:
      description: Uniek verzoek-ID voor tracing in logs
      schema:
        type: string
        format: uuid

  # ───────────────────────────────────────────────────────────────────────────
  # Herbruikbare antwoorden
  # ───────────────────────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Authenticatie ontbreekt of is ongeldig
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Geen admin-rol in het token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Verzoek ongeldig (verplicht veld ontbreekt of validatiefout)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource niet gevonden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Interne serverfout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ───────────────────────────────────────────────────────────────────────────
  # Schema's
  # ───────────────────────────────────────────────────────────────────────────
  schemas:
    SportlinkAutoLoginStatus:
      type: object
      properties:
        configured:
          type: boolean
        enabled:
          type: boolean
        lastLoginUtc:
          type: string
          format: date-time
          nullable: true
        retryAfterUtc:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
          description: Generieke foutcategorie zonder providerrespons of secrets

    # ── Generiek ──────────────────────────────────────────────────────────────

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          description: "\"ok\" als database \"online\" is, settingsLoaded true is en (Postgres-tier) pendingMigrations leeg is, anders \"degraded\"."
          example: "ok"
        version:
          type: string
          example: "2.2.0.0"
        timestamp:
          type: string
          format: date-time
        database:
          type: string
          description: Databaseverbindingsstatus. "unconfigured" geeft HTTP 503 i.p.v. 200 (#859).
          enum: [online, paused, timeout, unavailable, unconfigured]
          example: "online"
        settingsLoaded:
          type: boolean
          description: >-
            false als de laatste poging om de clubinstellingen te laden mislukte (#859) — geen
            foutdetails hier, die staan in het functielog.
          example: true
        tier:
          type: string
          description: De databasetier waarmee dit artefact gebouwd is (build-time metadata).
          example: "SqlServer"
        provider:
          type: string
          description: De gebruikte databasedriver (build-time metadata).
          example: "Microsoft.Data.SqlClient"
        serverVersion:
          type: string
          nullable: true
          description: Het versienummer dat de databaseserver zelf teruggeeft; null als de database niet bereikbaar is.
          example: "16.0.4265.3"
        lastSync:
          type: string
          format: date-time
          nullable: true
          description: "Postgres-tier (#1081): laatste synchronisatietijd van de primaire club; null als er nooit gesynchroniseerd is."
        syncStale:
          type: boolean
          description: "Postgres-tier (#1081): true als lastSync ouder is dan SyncMaxAgeHours (standaard 36) of ontbreekt. Telt alleen mee in status waar een synchronisatie ook hoort te draaien."
          example: false
        tlsMode:
          type: string
          nullable: true
          description: "Postgres-tier (#1095): de TLS-modus die daadwerkelijk op de databaseverbinding geldt (bijv. VerifyFull, Require); null als database \"unconfigured\" is."
          example: "VerifyFull"
        tlsWarning:
          type: string
          nullable: true
          description: "Postgres-tier (#1095): null als het TLS-beleid (VerifyFull, #1004) gehaald is; anders een waarschuwing zonder host of credentials dat de verbinding versleuteld is maar het servercertificaat/de hostnaam niet volledig gevalideerd wordt."
          example: null
        schemaWarning:
          type: string
          nullable: true
          description: "Postgres-tier (#1098): null als public.appsettings alle kolommen heeft die deze versie verwacht; anders een waarschuwing dat de code vooruitloopt op het databaseschema en welke migratie ontbreekt. De applicatie draait dan door op de migratie-default."
          example: null
        pendingMigrations:
          type: array
          nullable: true
          items:
            type: string
          description: "Postgres-tier (#1098): bestandsnamen uit Database.Postgres/migrations/ die nog niet in de ledger schema_migrations staan. Leeg = code en schema lopen gelijk; null als de database niet bereikbaar is. Alleen lezen — toepassen blijft een handeling van de beheerder (Database.Postgres.Cli)."
          example: ["012_sportlink_extension.sql"]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Foutomschrijving
      required:
        - error
      example:
        error: "Request body met 'datum' veld is verplicht."

    # ── Planner ───────────────────────────────────────────────────────────────

    SlotToewijzing:
      type: object
      description: Toegewezen of alternatief tijdslot
      properties:
        datum:
          type: string
          format: date
          example: "2026-04-18"
        aanvangsTijd:
          type: string
          pattern: '^[0-2]\d:[0-5]\d$'
          example: "12:00"
        eindTijd:
          type: string
          pattern: '^[0-2]\d:[0-5]\d$'
          example: "13:15"
        veldNummer:
          type: integer
          example: 3
        veldNaam:
          type: string
          example: "veld 3"
        veldType:
          type: string
          nullable: true
          description: >-
            Veldtype zoals vastgelegd in dbo.Velden (vrije tekst, bijv. "kunstgras" of "natuurgras").
            Reist mee met het slot zodat consumers het niet uit het veldnummer hoeven te raden: die
            nummering geldt maar voor één accommodatie. null betekent onbekend — een consumer mag een
            slot met onbekend veldtype nooit wegfilteren, want het slot is aantoonbaar beschikbaar.
          example: "kunstgras"
        veldDeelGebruik:
          type: number
          format: float
          description: Fractie van het veld (0.25, 0.50 of 1.00)
          example: 1.0
        wedstrijdDuurMinuten:
          type: integer
          example: 75

    TeamConflictInfo:
      type: object
      description: Bestaande wedstrijd voor het team op de gevraagde datum
      properties:
        wedstrijd:
          type: string
          example: "[ClubCode] JO11-9JM - [Tegenstander] JO11-3"
        aanvangsTijd:
          type: string
          example: "11:30"
        eindTijd:
          type: string
          example: "12:45"
        veldNaam:
          type: string
          example: "veld 4"

    BeschikbaarVenster:
      type: object
      description: Beschikbaar tijdvenster per veld (modus zonder leeftijdscategorie)
      properties:
        veldNummer:
          type: integer
          example: 5
        veldNaam:
          type: string
          example: "veld 5"
        veldType:
          type: string
          nullable: true
          description: >-
            Veldtype zoals vastgelegd in dbo.Velden (vrije tekst, bijv. "kunstgras" of "natuurgras").
            null betekent onbekend; zie de toelichting bij SlotToewijzing.veldType.
          example: "natuurgras"
        van:
          type: string
          example: "17:00"
        tot:
          type: string
          example: "19:20"
        maxDuurMinuten:
          type: integer
          example: 140
        opmerking:
          type: string
          nullable: true
          example: "Zonsondergang 21:28, geen kunstlicht"

    CheckAvailabilityRequest:
      type: object
      required:
        - datum
      properties:
        datum:
          type: string
          format: date
          description: Datum in yyyy-MM-dd formaat
          example: "2026-04-18"
        aanvangsTijd:
          type: string
          nullable: true
          description: Gewenste aftrapttijd HH:mm. Weglaten om beste slot te vinden.
          example: "12:00"
        dagdeel:
          type: string
          nullable: true
          enum: [ochtend, middag, avond]
          description: Dagdeelfilter
        leeftijdsCategorie:
          type: string
          nullable: true
          description: Leeftijdscategorie (bijv. JO13, MO17, VR, 1-99). Bepaalt duur en veldgrootte.
          example: "JO13"
        teamNaam:
          type: string
          nullable: true
          description: Teamnaam voor conflictcontrole en teamspecifieke regels
          example: "[ClubCode] JO13-1"
        tegenstander:
          type: string
          nullable: true
          description: Tegenstander (alleen voor administratie)
          example: "[Tegenstander] JO13-2"
        wedstrijdDuurMinuten:
          type: integer
          nullable: true
          description: Overschrijf wedstrijdduur in minuten (standaard uit Speeltijden)
        heelVeld:
          type: boolean
          nullable: true
          description: |
            Dwing een heel veld af, ook als de leeftijdscategorie normaal op een deelveld speelt.
            Geeft een waarschuwing terug in plaats van een fout.

    CheckAvailabilityResponse:
      type: object
      properties:
        beschikbaar:
          type: boolean
        toewijzing:
          $ref: '#/components/schemas/SlotToewijzing'
          nullable: true
        teamConflict:
          $ref: '#/components/schemas/TeamConflictInfo'
          nullable: true
        reden:
          type: string
          nullable: true
        alternatieven:
          type: array
          items:
            $ref: '#/components/schemas/SlotToewijzing'
        beschikbareVensters:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/BeschikbaarVenster'
        waarschuwingen:
          type: array
          items:
            type: string

    BevestigRequest:
      type: object
      required:
        - datum
        - aanvangsTijd
        - veldNummer
      properties:
        datum:
          type: string
          format: date
          example: "2026-04-25"
        aanvangsTijd:
          type: string
          example: "12:00"
        veldNummer:
          type: integer
          example: 3
        leeftijdsCategorie:
          type: string
          nullable: true
          example: "JO13"
        teamNaam:
          type: string
          nullable: true
          example: "[ClubCode] JO13-1"
        tegenstander:
          type: string
          nullable: true
          example: "[Tegenstander] JO13-2"
        aangevraagdDoor:
          type: string
          nullable: true
          example: "trainer@voorbeeld.nl"
        wedstrijdDuurMinuten:
          type: integer
          nullable: true
        heelVeld:
          type: boolean
          nullable: true
          description: |
            Dwing een heel veld af, ook als de leeftijdscategorie normaal op een deelveld speelt.
            Geeft een waarschuwing terug in plaats van een fout.

    BevestigResponse:
      type: object
      properties:
        id:
          type: integer
        datum:
          type: string
          format: date
        aanvangsTijd:
          type: string
        eindTijd:
          type: string
        veldNummer:
          type: integer
        status:
          type: string
          example: "Te bevestigen"

    BevestigConflictResponse:
      description: |
        Antwoord bij een bezettingsconflict (#1134) — dezelfde notie van conflict als
        `POST /planner/check-availability`: volledige-veldreserveringen die overlappen, of
        gedeelde-veldreserveringen waarvan de veldfracties samen boven 1.00 uitkomen.
      type: object
      properties:
        error:
          type: string
          example: "Veld 3 is op 2026-04-25 tussen 12:00 en 13:15 al bezet."
        conflicterendeWedstrijd:
          type: object
          properties:
            wedstrijd:
              type: string
              nullable: true
              example: "[ClubCode] JO13-1 - Tegenstander"
            aanvangsTijd:
              type: string
              example: "12:30"
            eindTijd:
              type: string
              example: "13:45"
            veldNummer:
              type: integer
              example: 3
            veldDeelGebruik:
              type: number
              format: decimal
              example: 1.00
            bron:
              type: string
              description: "Herkomst van de conflicterende bezetting: Competitie, Planner of Training"
              example: "Planner"

    ZoekWedstrijdRequest:
      type: object
      required:
        - teamNaam
        - datum
      properties:
        teamNaam:
          type: string
          description: Teamnaam (gedeeltelijke match ondersteund)
          example: "[ClubCode] JO8-2"
        datum:
          type: string
          format: date
          example: "2026-05-09"

    WedstrijdSamenvatting:
      type: object
      properties:
        wedstrijdcode:
          type: integer
          format: int64
          example: 12345678
        wedstrijd:
          type: string
          example: "[ClubCode] JO8-2 - Tegenstander JO8-1"
        datum:
          type: string
          format: date
        aanvangsTijd:
          type: string
        eindTijd:
          type: string
        veldNaam:
          type: string
          nullable: true
        leeftijdsCategorie:
          type: string
          nullable: true
        duurMinuten:
          type: integer
        veldDeelGebruik:
          type: number
          format: float

    HerplanCheckRequest:
      type: object
      required:
        - wedstrijdcode
      properties:
        wedstrijdcode:
          type: integer
          format: int64
          example: 12345678
        voorkeurTijd:
          type: string
          nullable: true
          description: Gewenste nieuwe tijd HH:mm
          example: "10:00"
        dagdeel:
          type: string
          nullable: true
          enum: [ochtend, middag, avond]
        richting:
          type: string
          nullable: true
          enum: [vervroegen, verlaten]
          description: Of alternatieven voor of na de huidige aanvangstijd mogen vallen

    HerplanCheckResponse:
      type: object
      properties:
        huidigeWedstrijd:
          $ref: '#/components/schemas/WedstrijdSamenvatting'
        beschikbaar:
          type: boolean
        alternatieven:
          type: array
          items:
            $ref: '#/components/schemas/SlotToewijzing'
        reden:
          type: string
          nullable: true
        waarschuwingen:
          type: array
          items:
            type: string

    HerplanBevestigRequest:
      type: object
      required:
        - wedstrijdcode
        - gewensteAanvangsTijd
      properties:
        wedstrijdcode:
          type: integer
          format: int64
          example: 12345678
        gewensteAanvangsTijd:
          type: string
          example: "10:00"
        gewenstVeldNummer:
          type: integer
          nullable: true
        aangevraagdDoor:
          type: string
          nullable: true
          example: "tegenstander via email"
        opmerking:
          type: string
          nullable: true
          example: "08:30 is niet haalbaar"

    HerplanBevestigResponse:
      type: object
      properties:
        id:
          type: integer
        wedstrijdcode:
          type: integer
          format: int64
        huidigeWedstrijd:
          type: string
        gewensteAanvangsTijd:
          type: string
        gewenstVeldNummer:
          type: integer
          nullable: true
        status:
          type: string
          example: "Aangevraagd"

    DoordeweeksBeschikbaarRequest:
      type: object
      properties:
        dagFilter:
          type: string
          nullable: true
          enum: [maandag, dinsdag, woensdag, donderdag]
          description: Filter op dag van de week. Leeg = alle doordeweekse dagen.
        duurMinuten:
          type: integer
          nullable: true
          description: Minimale duur in minuten
        leeftijdsCategorie:
          type: string
          nullable: true
          description: Leeftijdscategorie voor automatische duur

    DoordeweekseDatum:
      type: object
      properties:
        datum:
          type: string
          format: date
        dag:
          type: string
          example: "maandag"
        beschikbareVensters:
          type: array
          items:
            $ref: '#/components/schemas/BeschikbaarVenster'

    DoordeweeksBeschikbaarResponse:
      type: object
      properties:
        beschikbareDatums:
          type: array
          items:
            $ref: '#/components/schemas/DoordeweekseDatum'
        dagFilter:
          type: string
          nullable: true
        seizoenEinde:
          type: string
          format: date
        aantalBeschikbaar:
          type: integer

    TeamScheduleWedstrijd:
      type: object
      properties:
        datum:
          type: string
          format: date
        aanvangsTijd:
          type: string
        thuisUit:
          type: string
          enum: [thuis, uit]
        tegenstander:
          type: string
        type:
          type: string
          enum: [competitie, beker, oefenwedstrijd]
        veld:
          type: string
          nullable: true
        wedstrijdcode:
          type: integer
          format: int64
          nullable: true

    TeamScheduleZaterdag:
      type: object
      properties:
        datum:
          type: string
          format: date
        status:
          type: string
          enum: [vrij, oefenwedstrijd, bezet]
        bezetDoor:
          $ref: '#/components/schemas/TeamScheduleWedstrijd'
          nullable: true

    TeamScheduleResponse:
      type: object
      properties:
        team:
          type: string
        seizoenEinde:
          type: string
          format: date
        zaterdagen:
          type: array
          items:
            $ref: '#/components/schemas/TeamScheduleZaterdag'
        wedstrijden:
          type: array
          items:
            $ref: '#/components/schemas/TeamScheduleWedstrijd'

    # ── Beheer — AppSettings ───────────────────────────────────────────────────

    AppSettingsResponse:
      type: object
      description: |
        Niet-gevoelige AppSettings velden. SportlinkClientId en geheimen worden nooit teruggegeven.
      properties:
        ClubName:
          type: string
          nullable: true
        ClubCode:
          type: string
          nullable: true
        SportlinkApiUrl:
          type: string
          nullable: true
        SeasonStartMonth:
          type: integer
          nullable: true
        Accommodatie:
          type: string
          nullable: true
        LastSyncTimestamp:
          type: string
          format: date-time
          nullable: true
        FetchSchedule:
          type: string
          nullable: true
          description: CRON-expressie in 6-veld Azure-formaat
          example: "0 0 4 * * *"
        PlannerAfzenderNaam:
          type: string
          nullable: true
        CoordinatorNaam:
          type: string
          nullable: true
        CoordinatorFunctie:
          type: string
          nullable: true
        PlannerEmailAdres:
          type: string
          nullable: true
        HerplanDeadlineDagen:
          type: integer
          nullable: true
        BufferMinuten:
          type: integer
          nullable: true
        EmailVoetnoot:
          type: string
          nullable: true
        AccommodatiePlaats:
          type: string
          nullable: true
        AccommodatieLatitude:
          type: number
          format: double
          nullable: true
        AccommodatieLongitude:
          type: number
          format: double
          nullable: true
        UseRealtimeApi:
          type: boolean
          description: "true = live Sportlink API raadplegen bij plannercheck; false = alleen DB"
          default: true
        KnvbPdfBijlageIngeschakeld:
          type: boolean
          description: |
            Bij een herplanverzoek van een tegenstander zonder concrete nieuwe datum: stuurt de
            KNVB-speeldagenkalender als PDF-bijlage + een paar vrije zaterdagen mee, met de
            begeleiding van het eigen team in BCC (#561). Uit = bestaand herplan-gedrag ongewijzigd.
          default: true
        ZekerheidspoortActief:
          type: boolean
          description: |
            Zekerheidspoort (#1568): een e-mailantwoord dat de beslissingstrace als onzeker of mislukt
            beoordeelt gaat niet automatisch naar de afzender maar krijgt status Review. Standaard true;
            false = het oude gedrag (altijd automatisch antwoorden).
          default: true
        PdfExportIngeschakeld:
          type: boolean
          description: |
            PDF-export van planningen (`?format=pdf` op `/planner/veldbezetting` en
            `/planner/auto-plan`) voor deze club (#1459). Standaard false (fail-closed): de PDF gebruikt
            QuestPDF onder de Community-licentie (organisaties onder USD 1 mln jaaromzet); een
            beheerder bevestigt dat die voorwaarden gelden door dit aan te zetten. Uit = `?format=pdf`
            geeft 409; HTML-export blijft werken.
          default: false
        KnvbStandaardRegio:
          type: string
          nullable: true
          description: |
            KNVB-regio van deze club, bepaalt welke speeldagenkalender wordt gebruikt (#561).
            Ontbreekt deze waarde, dan wordt de hele KnvbPdfBijlageIngeschakeld-flow overgeslagen —
            er is bewust geen standaardregio in code.
          enum: [West, Noord, Oost, Zuid, Landelijk, LandelijkJeugd]
        SportlinkExtensionEnabled:
          type: boolean
          description: |
            Schakelaar voor de Sportlink Web Extension (epic #986, issue #988) — schrijft
            wedstrijdwijzigingen terug naar club.sportlink.com op naam van een rol-gebonden
            Sportlink-serviceaccount. Standaard uit.
          default: false
        fetchScheduleLeesbaar:
          type: string
          nullable: true
          description: Leesbare weergave van de CRON-expressie
          example: "Elke dag om 04:00"
        volgendeMomenten:
          type: array
          nullable: true
          items:
            type: string
            format: date-time
          description: Eerstvolgende 3 uitvoertijden

    SportlinkExtensieRolResponse:
      type: object
      description: Rol↔serviceaccount-koppelingsstatus (Sportlink Web Extension, epic #986/#988).
      properties:
        RolNaam:
          type: string
          example: "Wedstrijdzaken"
        Gekoppeld:
          type: boolean
        LaatstGekoppeldDoor:
          type: string
          nullable: true
        LaatstGekoppeldOp:
          type: string
          format: date-time
          nullable: true
        SportlinkAccountNaam:
          type: string
          nullable: true

    RolFeatureInstellingResponse:
      type: object
      description: |
        Eén cel van de toegangsmatrix: een rol × functie-combinatie met zijn huidige aan/uit-stand
        bij deze club (#1390, opvolger van #1341/epic #1338). `admin` komt hier nooit in voor —
        die rol heeft altijd alles aan.
      properties:
        RolNaam:
          type: string
          enum: [user, Wedstrijdzaken, Sectiehoofd, Ledenadministratie]
        FeatureKey:
          type: string
          enum:
            - sportlink.kleedkamers
            - sportlink.scheidsrechter
            - sportlink.veld
            - menu.dashboard
            - menu.teambegeleiding
            - menu.planning
            - menu.veldoptimalisatie
            - menu.leermomenten
            - menu.teamaliassen
            - menu.emailtester
            - menu.wijzigingsverzoeken
            - menu.wedstrijdaanmaken
            - menu.instellingen.speeltijden
            - menu.instellingen.velden
            - menu.instellingen.begeleidingimport
            - menu.instellingen.voorkeurstijden
            - menu.instellingen.emailtemplates
            - menu.instellingen.thema
            - menu.instellingen.sportlinkextensie
        Enabled:
          type: boolean

    SportlinkMatchInfoResponse:
      type: object
      description: |
        Read-only wedstrijdgegevens uit Sportlink Club (#991, epic #986). Spiegelt grotendeels
        Planner.Shared.Integrations.SportlinkClub.SportlinkMatch (gedeelde DTO, #991/#998), plus
        sinds #1339 fieldId/fieldSize (huidig veld, prefill) en de server-berekende
        veldOpties/subpositieOpties (géén Sportlink-veld, zie SportlinkMatchFunction.BouwPaneelResponse
        in beide tiers). Veldnamen zijn camelCase — de expliciete System.Text.Json
        [JsonPropertyName]-attributen op SportlinkMatch, niet de PascalCase C#-eigenschapsnamen,
        bepalen de werkelijke JSON op de draad (gecorrigeerd bij #1339; deze schema-sectie
        documenteerde eerder abusievelijk PascalCase).
      properties:
        publicMatchId:
          type: string
          nullable: true
        externalMatchId:
          type: string
          nullable: true
        matchDate:
          type: string
          format: date-time
          nullable: true
        matchStatus:
          type: string
          nullable: true
        isHomeMatch:
          type: boolean
        isCanceledMatch:
          type: boolean
        isConceptMatch:
          type: boolean
        taskStatus:
          type: string
          nullable: true
        isEditFieldAllowed:
          type: boolean
        isAssignDressingRoomsAllowed:
          type: boolean
        isAssignOfficialsAllowed:
          type: boolean
        isEditFieldSidePanelAllowed:
          type: boolean
        isAddScoreAllowed:
          type: boolean
        matchField:
          type: object
          nullable: true
          description: Accommodatiecode van de wedstrijd — geen persoonsgegeven.
          properties:
            facilityId:
              type: string
              nullable: true
            subFacilityId:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        field:
          type: object
          nullable: true
          description: Huidig veld(deel) van de wedstrijd, rauw zoals Sportlink het teruggeeft.
          properties:
            fieldId:
              type: string
              nullable: true
            fieldSize:
              type: string
              nullable: true
            fieldOffset:
              type: integer
              nullable: true
        fieldId:
          type: string
          nullable: true
          description: "#1339: gelijk aan field.fieldId, plat op rootniveau voor prefill in de UI."
        fieldSize:
          type: string
          nullable: true
          description: "#1339: gelijk aan field.fieldSize, plat op rootniveau voor prefill in de UI."
        veldOpties:
          type: array
          description: |
            #1339: server-berekend voorstel per actief club-veld — géén Sportlink-gegeven. Zie
            Planner.Shared.Integrations.SportlinkClub.SportlinkFieldIdBuilder voor de
            berekeningswijze en de beperkte zekerheid ervan (bevestigd voor precies één
            testwedstrijd/club).
          items:
            type: object
            properties:
              veldNummer:
                type: integer
              veldNaam:
                type: string
              voorstelFieldId:
                type: string
                nullable: true
        subpositieOpties:
          type: array
          description: "#1339: server-berekend FieldSize-voorstel per subpositie (null = heel veld)."
          items:
            type: object
            properties:
              subpositie:
                type: string
                nullable: true
              voorstelFieldSize:
                type: string
        kleedkamersFeatureToegestaan:
          type: boolean
          description: |
            #1341: combineer met isAssignDressingRoomsAllowed hierboven (beide moeten waar zijn) —
            dit is de per-rol-instelling, niet Sportlinks eigen permissievlag. Server-side leidend.
        scheidsrechterFeatureToegestaan:
          type: boolean
          description: "#1341: combineer met isAssignOfficialsAllowed hierboven."
        veldFeatureToegestaan:
          type: boolean
          description: "#1341: combineer met isEditFieldAllowed hierboven."
        magWijzigen:
          type: boolean
          description: |
            #1400: true zodra de aanroeper admin óf Wedstrijdzaken is — onafhankelijk van de drie
            per-club FeatureKey-toggles hierboven, want het wijzigingsverzoek datum/tijd/
            accommodatie heeft er bewust geen. Gate't het wijzigingsverzoek-blok in
            SportlinkMatchPanel; een gewone user (viewing is sinds #1400 generiek open) krijgt
            hier false.
        scheidsrechterRelatieCode:
          type: string
          nullable: true
          description: |
            #1340 (VOORSTEL — DPO-vraag rechtsgrond/bewaartermijn/logging nog NIET bevestigd door
            de eigenaar, zie docs/SPORTLINK-WEB-EXTENSION.md §8): relatiecode van de huidige
            scheidsrechter, uitsluitend als Sportlink er al één had toegewezen — nooit een naam of
            ander persoonsgegeven. Altijd null als scheidsrechterFeatureToegestaan hierboven false
            is (server-side genuld, ongeacht wat Sportlink teruggaf). Het Sportlink-JSON-veldnaam
            waaruit dit gelezen wordt is NOOIT live geverifieerd — zie
            Planner.Shared.Integrations.SportlinkClub.SportlinkMatchOfficial.RelatieCode.
        ar1RelatieCode:
          type: string
          nullable: true
          description: "#1340: relatiecode van de eerste assistent-scheidsrechter — zie scheidsrechterRelatieCode hierboven voor de volledige toelichting en de gate."
        ar2RelatieCode:
          type: string
          nullable: true
          description: "#1340: relatiecode van de tweede assistent-scheidsrechter — zie scheidsrechterRelatieCode hierboven voor de volledige toelichting en de gate."

    SportlinkMutationResponse:
      type: object
      description: |
        Resultaat van een schrijvende Sportlink-actie (#992/#993/#996, epic #986). Spiegelt
        Planner.Shared.Integrations.SportlinkClub.SportlinkMutationResult. `IsSuccess=false` met
        HTTP 200 betekent: de aanroep zelf lukte, Sportlink heeft de mutatie inhoudelijk afgewezen
        (zie Violations) — geen transportfout.
      properties:
        IsSuccess:
          type: boolean
        Violations:
          type: array
          nullable: true
          items:
            type: string
        IsDryRun:
          type: boolean
          description: |
            #998: true als dry-run actief was — niets is echt naar Sportlink verstuurd, de
            aanroep is alleen gesimuleerd en gelogd (audit-resultaat "DryRun"). IsSuccess is dan
            altijd true.
        IsForcedDryRun:
          type: boolean
          description: |
            #994: true als de PUT/POST werd overgeslagen door de code-niveau forceDryRun-lock (een
            mutatie waarvan de requestbody nog niet live bevestigd is, bijv. officials toewijzen) —
            ONAFHANKELIJK van de club-instelling sportlinkDryRun (audit-resultaat "DryRunLocked").
            Als dit true is, is IsDryRun ook altijd true.
        PublicMatchId:
          type: string
          nullable: true
          description: |
            #997: door Sportlink teruggegeven PublicMatchId van een NIEUW aangemaakte oefenwedstrijd
            (POST .../clubmatch/ClubMatch) — null voor elke andere mutatie, en ook null zolang
            IsForcedDryRun/IsDryRun de aanroep simuleerde (in de praktijk dus altijd null zolang de
            ClubMatch-code-lock actief is).

    SportlinkMatchChangeRequestResponse:
      type: object
      description: |
        Resultaat van het wijzigingsverzoek-endpoint — ALLEEN stap 1 (valideren) van Sportlinks
        tweestaps flow (#995, epic #986). Spiegelt
        Planner.Shared.Integrations.SportlinkClub.SportlinkMatchChangeRequestResult. Er bestaat
        bewust geen endpoint voor stap 2 (bevestigen).
      properties:
        Mutatie:
          $ref: '#/components/schemas/SportlinkMutationResponse'
        Validatie:
          type: object
          nullable: true
          description: |
            ONBEVESTIGD — geparsed uit Sportlinks `ConfirmationNeeded`-veld, nooit met een
            netwerktrace gezien. `null` zolang de code-lock actief is (in de praktijk altijd,
            zie `SportlinkClubClient.UpdateMatchDetailsChangeRequestLiveBevestigd`).
          properties:
            ConfirmationNeeded:
              type: boolean
            ValidationResultMessages:
              type: array
              nullable: true
              items:
                type: string
            HasBlockingMessages:
              type: boolean
            IsSuccess:
              type: boolean
              nullable: true
              description: "#1320: toplevel-veld uit Sportlinks respons — ONBEVESTIGD voor de verplichte-wijzigingsverzoek-vorm, zie docs/SPORTLINK-WEB-EXTENSION.md §6.4."
            IsMatchChangeRequestMandatory:
              type: boolean
              nullable: true
            IsOwnFacility:
              type: boolean
              nullable: true
            IsForceUpdate:
              type: boolean
              nullable: true

    SportlinkMatchWijzigingsverzoekTraceResponse:
      type: object
      description: |
        Sinds #1320: het antwoord op PUT .../change-request is deze trace-wrapper in plaats van
        kaal SportlinkMatchChangeRequestResponse — voor de eigenaar-gestuurde productieproef met
        diagnostiektrace. Spiegelt
        Planner.Shared.Integrations.SportlinkClub.SportlinkMatchWijzigingsverzoekTrace.
      properties:
        Resultaat:
          $ref: '#/components/schemas/SportlinkMatchChangeRequestResponse'
        AuditId:
          type: integer
          format: int64
          nullable: true
          description: "null als er geen audit-service geregistreerd is. Nodig voor PUT /sportlink/audit/{id}/notitie."
        HttpStatusCode:
          type: integer
          nullable: true
        Endpoint:
          type: string
          example: competition/match/UpdateMatchDetails
        HttpMethode:
          type: string
          example: PUT
        TijdstipUtc:
          type: string
          format: date-time

    OefenwedstrijdAanmaakResponse:
      description: |
        Het generieke mutatieresultaat (zelfde velden als SportlinkMutationResponse) plus wat er naar
        Sportlink is gestuurd. Sinds #1427 bouwt de server de body met Sportlinks eigen aanmaaklijsten
        (ClubMatchDefaults, PickListsTeams, PickListsLocation, PickListsMatchInformation).
        Waarschuwingen zijn terugvallen op Sportlinks standaardwaarden, geen fouten.
      allOf:
        - $ref: '#/components/schemas/SportlinkMutationResponse'
        - type: object
          properties:
            Omschrijving: { type: string }
            SportlinkTeamId:
              type: string
              nullable: true
              description: Het `T…`-team-ID uit Sportlinks teamlijst (PublicHomeTeamId én PublicAwayTeamId).
            AgeClassCode:
              type: string
              nullable: true
              description: Code uit Sportlinks leeftijdscategorieën, bijv. `001` = Senioren (M).
            FacilityId: { type: string, nullable: true }
            SubFacilityId:
              type: string
              nullable: true
              description: Het veld zoals Sportlink het kent (volgt geen vast patroon uit het veldnummer).
            SportIdTag:
              type: string
              nullable: true
              description: Spelactiviteit, bijv. `SOCCER-VE-AL/FRIDAY` = Veld - Vrijdag.
            WedstrijdNummer:
              type: integer
              format: int64
              nullable: true
              description: ExternalMatchId uit de eigen teller (#1437) — `YYMMDD` + tweecijferig volgnummer per speeldag, bijv. 26100201.
            VeldNaam: { type: string, nullable: true }
            Velddeel:
              type: string
              nullable: true
              description: '#1437: het velddeel zoals het naar Sportlink ging (`FieldSize`): 1.0, 0.5, 0.25 of 0.125.'
            Waarschuwingen:
              type: array
              items: { type: string }
    OefenwedstrijdFormulierResponse:
      type: object
      description: Voorinvulling voor "Wedstrijd aanmaken" (#1437).
      properties:
        Teams:
          type: array
          items:
            type: object
            properties:
              TeamNaam: { type: string }
              Leeftijdscategorie:
                type: string
                nullable: true
                description: Onze leeftijdscategorie van het team (bijv. `JO10`, `1-99`).
              AgeClassCode:
                type: string
                nullable: true
                description: Het Sportlink-`Id` dat bij die categorie hoort; `null` als onbekend of Sportlink niet bereikbaar.
              Duur:
                type: integer
                nullable: true
                description: Wedstrijdduur in minuten uit de speeltijden van de club.
              Veldafmeting:
                type: string
                nullable: true
                description: De veldafmeting uit de speeltijden als velddeel — `1.0`, `0.5`, `0.25` of `0.125`; `null` als onbekend.
        AgeClasses:
          type: array
          description: Sportlinks leeftijdscategorielijst; leeg als Sportlink niet bereikbaar is.
          items:
            type: object
            properties:
              Id: { type: string }
              Description: { type: string }
        SportlinkBeschikbaar:
          type: boolean
          description: "`false` als Sportlinks lijst niet kon worden opgehaald (de teamgegevens zijn dan wel compleet)."
    SportlinkClubMatchPickListsResponse:
      type: object
      description: |
        De twee ondersteunende picklists die in deze ronde bewust WEL zijn aangesloten (#997,
        bewust beperkte scope): PickListsTeams + PickListsLocation. Read-only en
        persoonsgegevensvrij (teams/locaties, geen personen). Sinds #1427 is de responsvorm live
        vastgesteld (`ClubTeams[]`, `Facilities[]`); dit endpoint geeft per item alleen id + naam.
      properties:
        Teams:
          type: array
          items:
            $ref: '#/components/schemas/SportlinkPickListItem'
        Locations:
          type: array
          items:
            $ref: '#/components/schemas/SportlinkPickListItem'

    SportlinkPickListItem:
      type: object
      properties:
        Id:
          type: string
          nullable: true
        Naam:
          type: string
          nullable: true

    SportlinkExtensieHealthResponse:
      type: object
      description: |
        Statussectie Sportlink Web Extension (#998, epic #986). Zonder live=true uitsluitend uit
        eigen database (geen Sportlink-aanroep); nooit een tokenwaarde of Match-data met
        persoonsgegevens.
      properties:
        ExtensionEnabled:
          type: boolean
        DryRun:
          type: boolean
        EgressAllowed:
          type: boolean
        Rollen:
          type: array
          items:
            type: object
            properties:
              RolNaam:
                type: string
              Gekoppeld:
                type: boolean
              LaatstVerverstOp:
                type: string
                format: date-time
                nullable: true
              RefreshTokenVervaltOp:
                type: string
                format: date-time
                nullable: true
        LaatsteMutatieFout:
          type: string
          nullable: true
        LaatsteMutatieFoutOp:
          type: string
          format: date-time
          nullable: true
        LaatsteContractCheck:
          type: object
          nullable: true
          properties:
            UitgevoerdOp:
              type: string
              format: date-time
            IsOk:
              type: boolean
            HttpStatus:
              type: integer
              nullable: true
            AfwijkendeVelden:
              type: string
              nullable: true
            FoutmeldingSamenvatting:
              type: string
              nullable: true
        Live:
          type: object
          nullable: true
          description: Alleen gevuld bij ?live=true.
          properties:
            TokenRefreshGelukt:
              type: boolean
            MatchCheckResultaat:
              type: string
              nullable: true
            MatchCheckHttpStatus:
              type: integer
              nullable: true

    SportlinkChangeRequest:
      type: object
      description: |
        Eén inkomend wijzigingsverzoek (#996, epic #986). Spiegelt
        Planner.Shared.Integrations.SportlinkClub.SportlinkChangeRequest. Veldnamen letterlijk uit
        Sportlinks bundle-code (issue #996); `ChangeRequestStatus` en `IsIncomingRequest` bevestigd in #1439.
      properties:
        PublicMatchId:
          type: string
          nullable: true
        PublicRequestId:
          type: string
          nullable: true
        RequestStatus:
          type: string
          description: |
            Sportlinks `ChangeRequestStatus` (bevestigd uit Sportlinks bundle, #1439): APPROVED,
            CONFIRM_AWAY, CONFIRM_HOME, CONFIRM_UNION, DENIED, MATCH_FINALIZED of REVOKED.
          nullable: true
        IsIncomingRequest:
          type: boolean
          nullable: true
          description: true = inkomend (tegenstander vraagt ons), false = uitgaand (#1439).
        StatusGroep:
          type: string
          enum: [OPEN, ACCEPTED, DENIED, REVOKED, UNKNOWN]
          description: |
            Sportlinks vier filtergroepen, server-side afgeleid van RequestStatus (#1439). OPEN =
            CONFIRM_*, ACCEPTED = APPROVED/MATCH_FINALIZED. Alleen aanwezig op de GET-respons.
        ExternalMatchId:
          type: string
          nullable: true
          description: |
            Sportlinks wedstrijdnummer (`ExternalMatchId` uit de lijstrespons, veldnaam uit Sportlinks
            bundle, #1464). Terugval voor `Wedstrijd.Wedstrijdnummer`. Alleen op de GET-respons.
        Thuisteam:
          type: string
          nullable: true
          description: Sportlinks `HomeTeam.TeamName` (#1464). Terugval voor `Wedstrijd.Thuisteam`. Alleen op de GET-respons.
        Uitteam:
          type: string
          nullable: true
          description: Sportlinks `AwayTeam.TeamName` (#1464). Terugval voor `Wedstrijd.Uitteam`. Alleen op de GET-respons.
        RequestData:
          type: object
          nullable: true
          properties:
            CurrentDate: { type: string, nullable: true }
            CurrentStartTime: { type: string, nullable: true }
            CurrentFacilityName: { type: string, nullable: true }
            CurrentSubFacilityName: { type: string, nullable: true }
            RequestedDate: { type: string, nullable: true }
            RequestedStartTime: { type: string, nullable: true }
            RequestedFacilityName: { type: string, nullable: true }
            RequestedSubFacilityName: { type: string, nullable: true }
        Reason:
          type: string
          nullable: true
        Remarks:
          type: string
          nullable: true

    SportlinkWedstrijdContext:
      type: object
      description: |
        Eigen wedstrijdcontext bij een wijzigingsverzoek (#1111): uit `his.matches` via
        `public.sportlinkpublicmatchidcache`, niet uit extra Sportlink-velden (die zijn niet live
        bevestigd). Spiegelt FunctionApp.Postgres.Sportlink.SportlinkWedstrijdContext.
      properties:
        Wedstrijdcode: { type: integer, format: int64 }
        Wedstrijdnummer: { type: integer, format: int64, nullable: true }
        Thuisteam: { type: string, nullable: true }
        Uitteam: { type: string, nullable: true }
        Datum: { type: string, nullable: true, description: "YYYY-MM-DD (uit kaledatum)" }
        Tijd: { type: string, nullable: true, description: "Aanvangstijd zoals gesynchroniseerd, bijv. 14:30" }
        Accommodatie: { type: string, nullable: true }

    SportlinkChangeRequestOverzichtItem:
      description: |
        Eén rij van GET /sportlink/change-requests sinds #1111: het Sportlink-verzoek plus onze
        eigen wedstrijdcontext. Spiegelt FunctionApp.Postgres.Sportlink.SportlinkChangeRequestOverzichtItem.
      allOf:
        - $ref: '#/components/schemas/SportlinkChangeRequest'
        - type: object
          properties:
            Wedstrijd:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/SportlinkWedstrijdContext'

    UpdateSettingsRequest:
      type: object
      description: |
        Wijzig toegestane AppSettings-velden. Velden buiten de witte lijst worden genegeerd.
        Witte lijst: HerplanDeadlineDagen, BufferMinuten, PlannerAfzenderNaam, CoordinatorNaam,
        CoordinatorFunctie, PlannerEmailAdres, Accommodatie, FetchSchedule, EmailVoetnoot,
        AccommodatiePlaats, AccommodatieLatitude, AccommodatieLongitude, UseRealtimeApi,
        KnvbPdfBijlageIngeschakeld, KnvbStandaardRegio, SportlinkExtensionEnabled, PdfExportIngeschakeld,
        ZekerheidspoortActief
        (waarde `0`/`1`/`true`/`false`, anders 400).

        De audit-actor (wie de wijziging doorvoerde) wordt uitsluitend server-side bepaald uit de
        door Easy Auth gevalideerde claims — dit contract kent daarom geen "wie"-veld (#1003).
      properties:
        velden:
          type: object
          additionalProperties:
            type: string
            nullable: true
          description: Map van veldnaam naar nieuwe waarde
          example:
            BufferMinuten: "15"
            FetchSchedule: "0 0 4 * * *"

    UpdateSettingsResponse:
      type: object
      properties:
        gewijzigdeVelden:
          type: array
          items:
            type: string
        herstartVereist:
          type: boolean
          description: Handmatige herstart vereist als FetchSchedule gewijzigd maar Azure Management API niet geconfigureerd
        herstartAutomatisch:
          type: boolean
