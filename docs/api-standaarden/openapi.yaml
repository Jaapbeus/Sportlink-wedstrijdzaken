          type: integer
        issueUrl:
          type: string

    FeedbackInzageResponse:
      type: object
      properties:
        totaal:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              tijdstipUtc:
                type: string
                format: date-time
              inzienDoor:
                type: string
                nullable: true
              actie:
                type: string
