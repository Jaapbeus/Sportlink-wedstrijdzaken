    # ── Beheer — Clubs ────────────────────────────────────────────────────────

    ClubItem:
      type: object
      description: Club-entry uit dbo.AppSettings (multi-club overzicht)
      properties:
        clubCode:
          type: string
          example: "[clubcode]"
        clubName:
          type: string
          example: "[ClubNaam]"
        syncEnabled:
          type: boolean
          description: Of Sportlink-synchronisatie actief is voor deze club

    # ── Beheer — Speeltijden ──────────────────────────────────────────────────

    SpeeltijdItem:
      type: object
      description: Speeltijd-configuratie per leeftijdscategorie
      properties:
        Leeftijd:
          type: string
          description: Leeftijdscategorie (bijv. JO8, JO11, MO17, VR, 1-99)
          example: "JO13"
        Veldafmeting:
          type: number
          format: decimal
          description: Fractie van het veld (bijv. 0.5 = half veld)
          example: 1.0
        WedstrijdTotaal:
          type: integer
          description: Totale wedstrijdduur in minuten (speeltijd + rust)
          example: 75
        WedstrijdHelft:
          type: integer
          description: Duur van één helft in minuten
          example: 35
        WedstrijdRust:
          type: integer
          description: Rustduur in minuten
          example: 5

    SpeeltijdRequest:
      type: object
      required:
        - leeftijd
        - wedstrijdTotaal
      properties:
        leeftijd:
          type: string
          example: "JO13"
        veldafmeting:
          type: number
          format: decimal
          default: 1.0
        wedstrijdTotaal:
          type: integer
          description: Totale duur in minuten
          example: 75
        wedstrijdHelft:
          type: integer
          example: 35
        wedstrijdRust:
          type: integer
          example: 5
        standaardVoorkeurTijd:
          type: string
          nullable: true
          description: |
            Standaard voorkeurstijd "HH:mm" voor deze leeftijdscategorie (#666). Wordt door de
            auto-planner gebruikt voor teams zonder eigen rij in dbo.TeamVoorkeurTijden.
            null of leeg = geen streeftijd; de planner kiest dan het eerst beschikbare slot.
          example: "10:00"

    # ── Beheer — Theme ────────────────────────────────────────────────────────

    ThemeResponse:
      type: object
      properties:
        primary:
          type: string
          description: Primaire kleur (hex)
          example: "#1b6ec2"
        secondary:
          type: string
          example: "#6c757d"
        accent:
          type: string
          example: "#0071c1"
        textOnPrimary:
          type: string
          description: Tekstkleur op primaire achtergrond
          example: "#ffffff"
        clubWebsiteUrl:
          type: string
          nullable: true
        faviconUrl:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        lightColors:
          type: object
          nullable: true
          description: |
            Volledig kleurenpalet voor de lichte modus (#1254). Sleutel -> hexwaarde.
            Bewust een vrije sleutelverzameling en geen veld per kleur: het aantal kleuren groeit
            nog. `null` of leeg betekent: niet ingesteld, de client valt terug op de vier platte
            kleuren hierboven.
            Een sleutel moet `^[a-z][a-zA-Z0-9-]{0,39}$` zijn en een waarde `#rrggbb` of
            `#rrggbbaa`; maximaal 40 sleutels per palet. De waarde belandt in een CSS custom
            property, dus vrije CSS zoals `rgba(...)` wordt geweigerd.
          additionalProperties:
            type: string
            pattern: '^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$'
          example:
            primary: "#1b6ec2"
            cardBg: "#ffffff"
        darkColors:
          type: object
          nullable: true
          description: Als `lightColors`, voor de donkere modus.
          additionalProperties:
            type: string
            pattern: '^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$'
          example:
            primary: "#14213d"
            cardBg: "#171f30"

    ThemeSaveRequest:
      type: object
      properties:
        primary:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#1b6ec2"
        secondary:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#6c757d"
        accent:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#0071c1"
        textOnPrimary:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: "#ffffff"
        clubWebsiteUrl:
          type: string
          nullable: true
        faviconUrl:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        lightColors:
          type: object
          nullable: true
          description: |
            Volledig kleurenpalet voor de lichte modus (#1254). Sleutel -> hexwaarde.
            Bewust een vrije sleutelverzameling en geen veld per kleur: het aantal kleuren groeit
            nog. `null` of leeg betekent: niet ingesteld, de client valt terug op de vier platte
            kleuren hierboven.
            Een sleutel moet `^[a-z][a-zA-Z0-9-]{0,39}$` zijn en een waarde `#rrggbb` of
            `#rrggbbaa`; maximaal 40 sleutels per palet. De waarde belandt in een CSS custom
            property, dus vrije CSS zoals `rgba(...)` wordt geweigerd.
          additionalProperties:
            type: string
            pattern: '^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$'
          example:
            primary: "#1b6ec2"
            cardBg: "#ffffff"
        darkColors:
          type: object
          nullable: true
          description: Als `lightColors`, voor de donkere modus.
          additionalProperties:
            type: string
            pattern: '^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$'
          example:
            primary: "#14213d"
            cardBg: "#171f30"

    ThemeExtractResponse:
      type: object
      properties:
        colors:
          type: array
          items:
            type: string
          description: Meest voorkomende kleuren (max 8, zonder wit/zwart/grijs)
          example: ["#1b6ec2", "#e8f0fe"]
        faviconUrl:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true

    # ── Beheer — Leermomenten ─────────────────────────────────────────────────

    LeermomentItem:
      type: object
      description: Classificatie-leermoment uit planner.ClassificatieCorrectie
      properties:
        Id:
          type: integer
        OrigineleVerwerkingId:
          type: integer
          nullable: true
          description: Alleen bij herkomst `Reply`; een admin-leermoment heeft geen reply-paar.
        CorrectionVerwerkingId:
          type: integer
          nullable: true
          description: Alleen bij herkomst `Reply`.
        Herkomst:
          type: string
          enum: [Reply, Admin]
          description: "`Reply` = AI-herkende reply-correctie (wordt na 30 dagen geanonimiseerd, na 90 dagen verwijderd); `Admin` = door een beheerder toegevoegd (permanent, #1568 deel C)."
        AangemaaktDoorNaam:
          type: string
          nullable: true
          description: Momentopname van de weergavenaam van de beheerder (alleen herkomst `Admin`).
        AangemaaktOp:
          type: string
          format: date-time
          nullable: true
        HerkomstVerwerkingId:
          type: integer
          nullable: true
          description: Aanwijzing naar de verwerking waaruit het leermoment is voortgekomen; geen foreign key (de verwerking wordt opgeruimd).
        OrigineelVerzoekType:
          type: string
          nullable: true
        AfgeleidJuistType:
          type: string
          nullable: true
        OrigineleSamenvatting:
          type: string
          nullable: true
        CorrectieSamenvatting:
          type: string
          nullable: true
        IsGevalideerd:
          type: boolean
        IsAfgewezen:
          type: boolean
        mta_inserted:
          type: string
          format: date-time
        mta_modified:
          type: string
          format: date-time
          nullable: true

    LeermomentListResponse:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeermomentItem'

    LeermomentStatsResponse:
      type: object
      properties:
        pending:
          type: integer
          description: Nog niet beoordeelde leermomenten
        validated:
          type: integer
          description: Gevalideerde leermomenten
        rejected:
          type: integer
          description: Afgewezen leermomenten

    ValideerRequest:
      type: object
      required:
        - actie
      properties:
        actie:
          type: string
          enum: [valideer, afwijzen]
          description: "'valideer' = leermoment accepteren; 'afwijzen' = leermoment verwerpen"

    # ── Beheer — Teamaliassen ─────────────────────────────────────────────────

    TeamAliasItem:
      type: object
      description: |
        Afwijkende schrijfwijze van een teamnaam uit dbo.TeamAliassen, met de canonieke
        teamnaam uit dbo.Teams. Alleen status `validated` geldt als vertrouwde exacte match
        bij teamnaam-resolutie.
      properties:
        id:
          type: integer
        ruweTekst:
          type: string
          description: Exact zoals aangetroffen
          example: "13-1"
        ruweTekstGenormaliseerd:
          type: string
          description: Na normalisatie, gebruikt voor lookup
        teamId:
          type: integer
        teamnaam:
          type: string
          nullable: true
          description: Canonieke teamnaam uit dbo.Teams; null als het team niet meer bestaat
        leeftijdsCategorie:
          type: string
          nullable: true
        bron:
          type: string
          enum: [Sync, AiDisambiguatie, CoordinatorCorrectie]
        status:
          type: string
          enum: [pending, validated, rejected]
        aantalKeerGebruikt:
          type: integer
        mtaInserted:
          type: string
          format: date-time
          nullable: true
        mtaModified:
          type: string
          format: date-time
          nullable: true
        aangemaaktDoorNaam:
          type: string
          nullable: true
          description: Momentopname van de weergavenaam van de beheerder die de alias aanmaakte (#1568 deel C); null = door het systeem (sync of AI).
        aangemaaktOp:
          type: string
          format: date-time
          nullable: true
        herkomstVerwerkingId:
          type: integer
          nullable: true
          description: Aanwijzing naar de verwerking waaruit de alias is voortgekomen (geen foreign key).
        reden:
          type: string
          nullable: true
        beoordeeldDoorNaam:
          type: string
          nullable: true
          description: Wie de alias het laatst goedkeurde of afwees.
        beoordeeldOp:
          type: string
          format: date-time
          nullable: true

    TeamAliasListResponse:
      type: object
      properties:
        count:
          type: integer
          description: Aantal teruggegeven rijen
        limit:
          type: integer
        pending:
          type: integer
          description: Totaal aantal onbeoordeelde aliassen van de club (ongefilterd)
        validated:
          type: integer
          description: Totaal aantal goedgekeurde aliassen van de club
        rejected:
          type: integer
          description: Totaal aantal afgewezen aliassen van de club
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamAliasItem'

    TeamAliasValideerRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [validated, rejected]
          description: "'validated' = alias vertrouwen; 'rejected' = alias negeren"

    TeamAliasAanmaakRequest:
      type: object
      required: [ruweTekst, teamId]
      description: De aanmaker staat er bewust niet in; die komt uit het Easy Auth-principal.
      properties:
        ruweTekst:
          type: string
          maxLength: 200
          example: "j10-04"
        teamId:
          type: integer
        herkoppel:
          type: boolean
          default: false
          description: Alleen `true` als de beheerder expliciet een bestaande alias met dezelfde genormaliseerde tekst naar dit team wil verplaatsen.
        herkomstVerwerkingId:
          type: integer
          nullable: true
        reden:
          type: string
          maxLength: 200
          nullable: true

    TeamAliasAanmaakResponse:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [aangemaakt, herkoppeld, bestaat-al]
        ruweTekst:
          type: string
        ruweTekstGenormaliseerd:
          type: string
        teamId:
          type: integer
        teamnaam:
          type: string

    TeamKeuzeItem:
      type: object
      properties:
        teamId:
          type: integer
        teamnaam:
          type: string
        leeftijdsCategorie:
          type: string
          nullable: true

    OnbekendeTeamTekstItem:
      type: object
      description: Een teamtekst uit een binnengekomen e-mail die niet aan een team gekoppeld kon worden (#1568 deel C).
      properties:
        id:
          type: integer
        voorbeeld:
          type: string
          description: Gesaneerde, afgekapte schrijfwijze zoals aangetroffen (geen e-mailadressen of nummers).
        genormaliseerd:
          type: string
        aantal:
          type: integer
        eerstGezien:
          type: string
          format: date-time
        laatstGezien:
          type: string
          format: date-time
        laatsteVerwerkingId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [open, afgehandeld, genegeerd]

    OnbekendeTeamTekstListResponse:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        open:
          type: integer
          description: Aantal open regels van de club (ongefilterd)
        items:
          type: array
          items:
            $ref: '#/components/schemas/OnbekendeTeamTekstItem'

    OnbekendeTeamTekstStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, afgehandeld, genegeerd]

    LeermomentAanmaakRequest:
      type: object
      required: [juistVerzoekType, samenvatting]
      description: De aanmaker staat er bewust niet in; die komt uit het Easy Auth-principal.
      properties:
        origineelVerzoekType:
          type: string
          nullable: true
          description: Wat de pipeline ervan maakte; leeg = "Onbekend".
        juistVerzoekType:
          type: string
          enum: [BeschikbaarheidCheck, HerplanVerzoek, Bevestiging, TeamContactOpvragen, BuitenScope]
        samenvatting:
          type: string
          maxLength: 500
          description: Door de beheerder geredigeerde, korte omschrijving; wordt door de PII-arme sanering gehaald (e-mailadressen en nummers gemaskeerd, aanhalingstekens weg).
        herkomstVerwerkingId:
          type: integer
          nullable: true

    # ── Beheer — Teambegeleiding ──────────────────────────────────────────────

    TeambegeleidingLid:
      type: object
      description: |
        AVG: e-mailadressen en telefoonnummers alleen zichtbaar voor de admin-rol
        achter Entra ID auth. Nooit in auto-reply body opgenomen.
      properties:
        Naam:
          type: string
        Teamrol:
          type: string
          nullable: true
        Functie:
          type: string
          nullable: true
          description: Specifieke functie binnen de teamrol (bijv. "Trainer/coach"); null als de import geen Functie-kolom had (#1360)
        Emailadres:
          type: string
          nullable: true
        Telefoonnummer:
          type: string
          nullable: true

    TeambegeleidingDoorsturenRequest:
      type: object
      required:
        - team
        - onderwerp
        - bericht
      properties:
        team:
          type: string
          description: Teamnaam waarnaar het bericht gestuurd wordt
        onderwerp:
          type: string
        bericht:
          type: string
          description: Berichttekst (max 2000 tekens)
        ontvangers:
          type: string
          nullable: true
          description: |
            #765: vrije-tekst-regel met de gewenste ontvangers, gescheiden door `;` of `,`. Elk
            fragment mag `"Naam" <adres>` of een kaal adres zijn. Server-side geparsed, gevalideerd
            (geldige syntax, max 15, gededupliceerd) en gecontroleerd tegen de uitsluitingslijst
            (`dbo.UitgeslotenEmailAdressen`) vóór verzending.

            Leeg of afwezig → ongewijzigd fallback-gedrag: server-side opzoeken van de
            hoogst-geprioriteerde begeleider (Trainer > Coach > Teamleider), met de coördinator als
            fallback wanneer niemand gevonden wordt.

    TeambegeleidingImportRequest:
      type: object
      required:
        - csvContent
      properties:
        csvContent:
          type: string
          description: |
            Volledige inhoud van de CSV-export uit club.sportlink.com. Wordt in-memory verwerkt
            en nooit opgeslagen (AVG).
        bestandsnaam:
          type: string
          nullable: true
          description: Alleen voor de audit-regel in `avg.ImportLog` — puur metadata.

    TeambegeleidingImportResultaat:
      type: object
      properties:
        rijen:
          type: integer
          description: Aantal geïmporteerde gegevensrijen
        herkend:
          type: array
          description: Herkende CSV-kolomnamen
          items:
            type: string
        ontbreekt:
          type: array
          description: Ontbrekende verplichte kolommen (leeg bij een geslaagde import)
          items:
            type: string
        waarschuwingen:
          type: array
          description: Niet-blokkerende opmerkingen over de verwerkte CSV
          items:
            type: string

    # ── Testdata ──────────────────────────────────────────────────────────────

