      description: |
        Registreert (of overschrijft) dat een functionele rol een Sportlink-serviceaccount
        gekoppeld heeft gekregen. `LaatstGekoppeldDoor` wordt altijd server-side bepaald uit de
        ingelogde beheerder (X-MS-CLIENT-PRINCIPAL), nooit uit de request body.
      security:
