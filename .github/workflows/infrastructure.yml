name: Infrastructure (Bicep)

# Alleen handmatig uitvoerbaar — nooit automatisch bij push.
# Gebruik what-if om drift te detecteren zonder wijzigingen.
# Gebruik deploy alleen na expliciete goedkeuring eigenaar.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Actie'
        required: true
        default: 'what-if'
        type: choice
        options:
          - what-if
          - deploy
      deploy_monitoring:
        description: 'Monitoring deployen? (⚠️ Log Analytics is betaald voor nieuwe workspaces)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  RESOURCE_GROUP: myAppGroup
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  infrastructure:
    name: "Bicep ${{ inputs.action }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure inloggen
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: What-if — drift detecteren (geen wijzigingen)
        if: inputs.action == 'what-if'
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.parameters.json \
            --parameters deployMonitoring=${{ inputs.deploy_monitoring }}

      # #1455: een ARM PUT met siteConfig.appSettings VERVANGT alle app settings van de bestaande
      # Function App. Deze poort draait what-if en faalt als een bestaande setting zou verdwijnen;
      # alleen namen komen in het log, nooit waarden. Onleesbare uitvoer = falen (gesloten poort).
      - name: What-if-poort — mag er een app setting verdwijnen?
        if: inputs.action == 'deploy'
        env:
          AI_CS: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          SQL_CS: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          STORAGE_CS: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          DEPLOY_MONITORING: ${{ inputs.deploy_monitoring }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whatif.json"
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.parameters.json \
            --parameters deployMonitoring="$DEPLOY_MONITORING" \
            --parameters appInsightsConnectionString="$AI_CS" \
            --parameters sqlConnectionString="$SQL_CS" \
            --parameters azureWebJobsStorage="$STORAGE_CS" \
            --result-format FullResourcePayloads --no-pretty-print --output json > "$out"
          live="$RUNNER_TEMP/live-appsettings.json"
          echo '[]' > "$live"
          for site in $(bash scripts/ci/check-whatif-appsettings.sh --sites "$out"); do
            # Alleen namen ophalen — de waarden verlaten de query nooit.
            az functionapp config appsettings list -g "$RESOURCE_GROUP" -n "$site" \
              --query "[].{name:name}" --output json > "$live"
          done
          bash scripts/ci/check-whatif-appsettings.sh "$out" "$live"

      - name: Deploy — infrastructure bijwerken
        if: inputs.action == 'deploy'
        run: |
          echo "⚠️  Deploy naar $RESOURCE_GROUP gestart door ${{ github.actor }}"
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infrastructure/main.bicep \
            --parameters infrastructure/main.parameters.json \
            --parameters deployMonitoring=${{ inputs.deploy_monitoring }} \
            --parameters appInsightsConnectionString="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
            --parameters sqlConnectionString="${{ secrets.AZURE_SQL_CONNECTION_STRING }}" \
            --parameters azureWebJobsStorage="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"
