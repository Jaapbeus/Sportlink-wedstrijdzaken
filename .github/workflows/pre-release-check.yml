name: Pre-release check (develop → main)

# Draait uitsluitend op PRs die naar main gaan.
# Blokkeert de merge als de build faalt.
#
# BELANGRIJK (issue #1009): deze workflow bevat GEEN productiecredentials meer.
# GitHub voert een `pull_request`-workflow altijd uit met de YAML- én scriptinhoud van de
# PR zelf (head ref) — niet van main. Elke job hier moet dus veilig zijn om te draaien met
# willekeurige, nog niet gereviewde PR-inhoud. De databasebeschikbaarheidscheck
# (AZURE_CREDENTIALS / SQL_CONNECTION_STRING) staat daarom in een aparte workflow,
# pre-release-db-check.yml, die via `workflow_run` pas ná deze job draait en zijn eigen
# YAML altijd van main haalt. Zie die file voor de volledige onderbouwing.
#
# Configureer 'build-check' (en, via pre-release-db-check.yml, 'db-check') als required
# status checks in GitHub branch protection voor de main-branch.

on:
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Build-verificatie ──────────────────────────────────────────────────
  # Controleert dat FunctionApp en BlazorAdmin compileren op de te mergen code.
  # Gebruikt bewust geen secrets: de checkout hier is PR-head-inhoud die nog niet
  # gereviewd/geaccepteerd is.
  build-check:
    name: "Build geslaagd vóór release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .NET SDK installeren
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: FunctionApp bouwen
        run: dotnet build FunctionApp/fa-dev-sportlink-01.csproj -c Release

      - name: BlazorAdmin bouwen
        run: dotnet build BlazorAdmin/BlazorAdmin.csproj -c Release
