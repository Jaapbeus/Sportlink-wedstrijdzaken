name: Sluit gereleasede issues

# Zodra een release-tag naar main wordt gepusht (zelfde trigger als release.yml),
# doorzoekt deze workflow de commits sinds de vorige release-tag op #NNN-referenties,
# verwijdert het label 'status: awaiting-release' en sluit die issues definitief.
# Zie CLAUDE.md, sectie "Issue-lifecycle: awaiting-release".

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  issues: write
  contents: read

jobs:
  close-released-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (volledige geschiedenis + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Issue-nummers verzamelen sinds vorige release-tag
        id: issues
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -v "^${CURRENT_TAG}$" | head -n1 || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Vorige release-tag: $PREVIOUS_TAG"
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
          else
            echo "Geen vorige release-tag gevonden — volledige geschiedenis tot ${CURRENT_TAG}"
            RANGE="${CURRENT_TAG}"
          fi

          # Bron 1 — commit-subjects in de range. Dekt UITSLUITEND de conventie 'type(#NNN): ...'
          # aan het begin van het subject — niet elke #NNN die toevallig ergens in de regel staat.
          #
          # #838-vervolg: de oude, losse 'grep -oE #[0-9]+' pakte ELK nummer in de hele subject-
          # regel, inclusief een losse '(#NNN)'-kruisverwijzing die een sessie bewust MIDDEN in een
          # anders niet-geattribueerde commit-subject zet om een partiele oplevering (#820/#821)
          # opzettelijk open te laten. Zo'n subject ('fix: ... SQL Server-collatie (#820) (#869)')
          # werd hierdoor toch als "#820 is gereleased" gelezen, en #820 zou bij de eerstvolgende
          # release-tag ten onrechte gesloten zijn — exact dezelfde klasse loose-reference-bug als
          # #838 al voor label-awaiting-release.yml vaststelde, nu in een workflow die niet labelt
          # maar daadwerkelijk sluit. De titel-conventie 'type(#NNN): ...' (het issue dat déze commit
          # aantoonbaar afrondt) staat altijd vooraan; alles daarna is kruisverwijzing.
          COMMIT_NUMBERS=$(git log $RANGE --oneline \
            | grep -oE '^[0-9a-f]+ [a-z]+\(#[0-9]+\):' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -un)
          echo "Uit commit-subjects: $(echo $COMMIT_NUMBERS | tr '\n' ' ')"

          # Bron 2 — de CHANGELOG-sectie van deze versie (#630).
          # Commit-subjects alleen zijn niet genoeg: batch-PR's sommen niet alle nummers op in het
          # subject. Bij v2.17.0.0 miste dat #574, #575, #576, #579 en #599 terwijl die wel in de
          # release zaten. De CHANGELOG is de gecureerde lijst van wat er daadwerkelijk in zit.
          #
          # Alleen haakjesgroepen die UITSLUITEND issuenummers bevatten — '(#574)' of '(#599, #595)' —
          # conform de attributie-conventie uit CLAUDE.md. Zo blijven kruisverwijzingen in prozavorm
          # buiten beeld: '(zie #569)' en 'conform het patroon van issue #242' mogen niets sluiten.
          VERSION="${CURRENT_TAG#v}"
          CHANGELOG_NUMBERS=$(awk -v marker="## [${VERSION}]" '
              index($0, marker) == 1 { inside = 1; next }
              inside && /^## \[/ { exit }
              inside
            ' CHANGELOG.md \
            | grep -oE '\(#[0-9]+(, *#[0-9]+)*\)' \
            | grep -oE '[0-9]+' | sort -un || true)
          echo "Uit CHANGELOG-sectie [${VERSION}]: $(echo $CHANGELOG_NUMBERS | tr '\n' ' ')"

          NUMBERS=$(printf '%s\n%s\n' "$COMMIT_NUMBERS" "$CHANGELOG_NUMBERS" \
            | grep -E '^[0-9]+$' | sort -un | tr '\n' ',' | sed 's/,$//')
          echo "numbers=${NUMBERS}" >> "$GITHUB_OUTPUT"
          echo "tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Samengevoegd: ${NUMBERS:-geen}"

      - name: Issues sluiten en label verwijderen
        if: steps.issues.outputs.numbers != ''
        uses: actions/github-script@v9
        env:
          ISSUE_NUMBERS: ${{ steps.issues.outputs.numbers }}
          RELEASE_TAG: ${{ steps.issues.outputs.tag }}
        with:
          script: |
            // clearIssueStatus verwijdert ELK status-label, niet alleen 'awaiting-release'.
            // Een gesloten, uitgerold issue hoort geen lifecycle-status meer te hebben; bleef
            // er een 'in-progress' of 'review-needed' op staan, dan zou dat na de release nog
            // suggereren dat er werk loopt (#690).
            const { clearIssueStatus } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-status.js`);

            const tag = process.env.RELEASE_TAG;
            const numbers = process.env.ISSUE_NUMBERS.split(',').map(n => parseInt(n, 10)).filter(Boolean);

            for (const number of numbers) {
              let issue;
              try {
                issue = (await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                })).data;
              } catch (e) {
                core.warning(`#${number}: kon issue niet ophalen (${e.message}) — overgeslagen`);
                continue;
              }

              // issues.get retourneert ook PR's — die slaan we over.
              if (issue.pull_request) {
                continue;
              }

              await clearIssueStatus({ github, context, core, issueNumber: number });

              if (issue.state === 'open') {
                // Geen losse createComment hier (#789): dat verdubbelt de notificatie-e-mail per
                // issue (close-event + comment-event). De releaseinfo staat al op de GitHub
                // Release-pagina (gegenereerd door release.yml uit de CHANGELOG-sectie) en in de
                // CHANGELOG zelf, dus de comment voegde geen traceerbaarheid toe die niet al
                // ergens anders stond.
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.notice(`#${number}: gesloten (${tag})`);
              }
            }

      # Vangnet (#630): meld wat na deze run nog op 'awaiting-release' staat. Zonder dit rapport
      # blijft een gemist issue stil openstaan met een label dat suggereert dat het nog wacht —
      # precies de verwarring die #615 wilde wegnemen.
      - name: Rapporteer issues die nog op awaiting-release staan
        if: always()
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.issues.outputs.tag }}
          AFGEHANDELD: ${{ steps.issues.outputs.numbers }}
        with:
          script: |
            const label = 'status: awaiting-release';
            const { data: remaining } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 100,
            });

            // De label-index van GitHub loopt achter op de sluitingen uit de vorige stap: bij de
            // release van v2.17.1.0 meldde dit rapport #649 als 'blijft open' terwijl datzelfde
            // issue een seconde eerder in deze run was gesloten. Een vangnet dat bij elke release
            // valse alarmen geeft, wordt genegeerd — en dan doet het zijn werk niet meer.
            //
            // Daarom deterministisch filteren op wat deze run zelf heeft afgehandeld, in plaats van
            // te vertrouwen op de versheid van de index.
            const afgehandeld = new Set(
              (process.env.AFGEHANDELD || '')
                .split(',')
                .map(n => parseInt(n, 10))
                .filter(Number.isInteger)
            );

            const issues = remaining
              .filter(i => !i.pull_request)
              .filter(i => !afgehandeld.has(i.number));
            if (issues.length === 0) {
              core.notice(`Geen issues meer op '${label}' — lifecycle sluitend na ${process.env.RELEASE_TAG}.`);
              return;
            }

            const lijst = issues.map(i => `#${i.number} — ${i.title}`).join('\n');
            core.warning(
              `${issues.length} issue(s) staan na release ${process.env.RELEASE_TAG} nog op '${label}'.\n` +
              `Als de fix wél in deze release zat, ontbreekt het nummer in zowel de commit-subjects ` +
              `als de CHANGELOG-attributie — controleer handmatig:\n${lijst}`
            );
            await core.summary
              .addHeading(`Nog op '${label}' na ${process.env.RELEASE_TAG}`, 3)
              .addList(issues.map(i => `#${i.number} — ${i.title}`))
              .write();
