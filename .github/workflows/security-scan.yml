name: Security Scan

# #1202: de pull_request-trigger stond nog op de oude integratiebranch-namen. Sinds
# 2026-07-25 is `develop` de integratiebranch (build.yml en de branch protection zijn toen
# wél meegegaan, deze workflow niet) en bestaat er geen `v2/*`-branch meer. Gevolg: een PR
# uit een fork kreeg hier nooit een run — geen push-event in deze repo, geen pull_request-run
# — terwijl de branch protection van `develop` en `main` de check
# "Security Gate — blokkeert merge bij fout" verplicht stelt. Zo'n PR bleef dus eeuwig
# hangen én de merge-context werd nooit upstream gescand. Bij een PR binnen deze repo viel
# het niet op: de push-run rapporteert de check op dezelfde commit-SHA.
on:
  push:
    branches: ['**']
  # #1641: geen `branches`-filter, zodat ook een PR tegen een featurebranch (gestapelde PR) bouwt;
  # Bewust zonder `edited`: dat vuurt ook bij elke titel-/tekstwijziging (volledige run per `gh pr edit`);
  # na een base-retarget: `gh workflow run build.yml --ref <branch>`. GitHub start GEEN pull_request-run zolang de PR een
  # merge-conflict heeft ("Workflows will not run on `pull_request` activity if the pull request has
  # a merge conflict", docs.github.com, events-that-trigger-workflows). Eerst develop mergen.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # #1641: bewust geen workflow_dispatch: de push-run hierboven zet de Security Gate al op elke
  # gepushte SHA; alleen Build (PR) kan ontbreken en die heeft workflow_dispatch in build.yml.

# #1370 (retro v3.6.0.0, bevinding 2) — GEPROBEERD EN BEWUST TERUGGEDRAAID.
# Zelfde dedupmechanisme als build.yml (zie de toelichting daar): een concurrency-groep op
# workflow+commit-SHA met cancel-in-progress bleek op PR #1372 een reproduceerbare
# merge-blokkerende regressie te geven — GitHub's statusCheckRollup neemt bij twee check-runs
# met dezelfde naam op dezelfde SHA de SLECHTSTE uitkomst (FAILURE), niet de laatste, ook als
# de nieuwere run daarna succesvol afrondt. Bevinding 2 blijft open; zie de reactie op #1370.

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ══════════════════════════════════════════════════════════════════════════════
# BELANGRIJK: Als één of meer jobs hieronder falen, blokkeert de security-gate
# job automatisch de merge. Zie SECURITY.md voor het protocol bij een fout.
# ══════════════════════════════════════════════════════════════════════════════

jobs:
  # ── 1. Gitleaks: secrets en tokens in git-geschiedenis ─────────────────────
  gitleaks:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (volledige geschiedenis)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: GitHub-tokenformaten synthetisch verifiëren
        run: python3 scripts/ci/test-github-token-formats.py

      - name: GitHub-token met een leesaanroep verifiëren
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = core.getInput('github-token', { required: true });
            core.setSecret(token);
            const r = await github.request('GET /rate_limit');
            if (r.status !== 200) throw new Error('GitHub-token leescontrole mislukt');
            core.info('GitHub-token leescontrole geslaagd; geen tokenwaarde gelogd.');

      - name: Resultaat samenvatting
        if: failure()
        run: |
          echo "::error::GITLEAKS-JOB GEFAALD: detectiescan, patrooncontrole of GitHub-leescontrole mislukt"
          echo "::error::Controleer de gefaalde stap; verwijder en roteer alleen bij een bevestigde secretbevinding."
          echo "::error::Zie SECURITY.md § 'Wat te doen bij een gefaalde check'."

  # ── 2. Databestanden in repository ─────────────────────────────────────────
  pii-files:
    name: PII File Detection (CSV/Excel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Controleer op databestanden met persoonsgegevens
        run: |
          set -euo pipefail
          if /bin/bash scripts/ci/check-security-patterns.sh data-files; then
            :
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "::error::PII data-file scan detected findings; public output intentionally omits matching paths."
              echo "::error::CSV/Excel files must not be committed."
              echo "::error::Zie SECURITY.md § 'Wat te doen bij een gefaalde check'."
            else
              echo "::error::Security pattern scan could not complete."
            fi
            exit 1
          fi
          echo "✅ PII data-file scan completed."

  # ── 3. Nederlandse telefoonnummers en e-mails in code ──────────────────────
  pii-patterns:
    name: PII Pattern Scan (AVG/GDPR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan op Nederlandse PII-patronen
        run: |
          set -euo pipefail
          FOUND=0
          run_check() {
            local status
            if /bin/bash scripts/ci/check-security-patterns.sh "$1"; then
              return 0
            else
              status=$?
            fi
            if [ "$status" -eq 1 ]; then
              FOUND=1
              return 0
            fi
            echo "::error::Security pattern scan could not complete."
            exit 1
          }

          run_check pii
          run_check url-logging
          run_check exception-output

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Security pattern scan detected findings; public output intentionally omits matched data and locations."
            echo "::error::Zie SECURITY.md § 'Wat te doen bij een gefaalde check'."
            exit 1
          fi
          echo "✅ Security pattern scans completed."

  # ── 3b. PII in documentatiebestanden (CHANGELOG, docs/) ──────────────────
  pii-docs:
    name: PII in Documentatie (CHANGELOG/docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Scan CHANGELOG en docs op emailadressen
        run: |
          set -euo pipefail
          FOUND=0
          if /bin/bash scripts/ci/check-security-patterns.sh pii-docs; then
            :
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              FOUND=1
            else
              echo "::error::Security pattern scan could not complete."
              exit 1
            fi
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Documentation PII scan detected findings; public output intentionally omits matched data and locations."
            exit 1
          fi
          echo "✅ Documentation PII scan completed."

      - name: Scan recente commit-messages op PII
        run: |
          set -euo pipefail
          PHONE_FOUND=0
          # Controleer de laatste 20 commit-messages op emailadressen en telefoonnummers
          # Co-Authored-By/Co-authored-by regels worden uitgesloten (GitHub squash merge voegt deze toe)
          if /bin/bash scripts/ci/check-security-patterns.sh history-email; then
            :
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              echo "::warning::Commit-message email pattern detected; public output intentionally omits matched data and locations."
            else
              echo "::error::Security pattern scan could not complete."
              exit 1
            fi
          fi
          if /bin/bash scripts/ci/check-security-patterns.sh history-phone; then
            :
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              PHONE_FOUND=1
            else
              echo "::error::Security pattern scan could not complete."
              exit 1
            fi
          fi

          if [ "$PHONE_FOUND" -eq 1 ]; then
            echo "::error::Commit-message phone pattern detected; public output intentionally omits matched data and locations."
            exit 1
          fi
          echo "✅ Recent commit-message PII scan completed."

  # ── 3c. Club-specifieke infrastructuuridentifiers ─────────────────────────
  infra-patterns:
    name: Club-infrastructuur patrooncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan op Azure resource namen en infrastructuuridentifiers
        env:
          # Basisrepository-pushes vereisen privéconfiguratie; forks mogen expliciet overslaan.
          # Regexes blijven uitsluitend in het secret en de scanneromgeving.
          CLUB_EXTRA_PATTERNS: ${{ secrets.CLUB_EXTRA_PATTERNS || '' }}
          REQUIRE_CLUB_EXTRA_PATTERNS: ${{ github.event_name == 'push' && !github.event.repository.fork }}
        run: |
          set -euo pipefail
          FOUND=0
          run_check() {
            local status
            if /bin/bash scripts/ci/check-security-patterns.sh "$1"; then
              return 0
            else
              status=$?
            fi
            if [ "$status" -eq 1 ]; then
              FOUND=1
              return 0
            fi
            echo "::error::Security pattern scan could not complete."
            exit 1
          }

          run_check infra-structural
          run_check infra-private

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Security pattern scan detected findings; public output intentionally omits matched data and locations."
            echo "::error::Zie SECURITY.md § 'GitHub issues, PR's en comments'."
            exit 1
          fi
          echo "✅ Shared infrastructure pattern scans completed."

  # ── 4. Dependency vulnerability scan (Trivy) ───────────────────────────────
  #
  # #1126: een kale `.csproj` is voor Trivy geen ondersteund NuGet-manifest — zonder
  # restore vond deze job structureel "Number of language-specific files num=0" en de
  # gate was groen zonder ooit een pakket te scannen (zie run 34708758622, sub-issue van
  # de codereview #1107). Trivy leest wél packages.lock.json (met transitieve pakketten,
  # https://trivy.dev/latest/docs/coverage/language/dotnet/), dus deze job genereert
  # er zelf één per project via `dotnet restore -p:RestorePackagesWithLockFile=true` —
  # NIET gecommit (Dependabot onderhoudt hier geen lock-bestanden; commit zou stilzwijgend
  # uit de pas lopen met de echte restore, zie .gitignore). Twee harde guards bewaken dat
  # deze job zelf nooit meer stilzwijgend leeg scant: vóór Trivy (lock-bestanden aanwezig
  # en gevuld) en ná Trivy (daadwerkelijk ≥1 nuget-manifest gescand).
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Alle projecten targeten net10.0 (#1073) — alleen de .NET 10 SDK is nodig.
      - name: .NET SDK installeren
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Geen hardcoded projectlijst: een glob zodat een nieuw project automatisch
      # meegenomen wordt zonder deze workflow te hoeven aanpassen.
      - name: NuGet lock-bestanden genereren (packages.lock.json per project)
        id: restore
        run: |
          set -euo pipefail
          mapfile -t PROJECTS < <(git ls-files '*.csproj' | sort)
          echo "Gevonden .csproj-projecten (${#PROJECTS[@]}):"
          printf '  %s\n' "${PROJECTS[@]}"
          for proj in "${PROJECTS[@]}"; do
            echo "::group::dotnet restore $proj -p:RestorePackagesWithLockFile=true"
            dotnet restore "$proj" -p:RestorePackagesWithLockFile=true
            echo "::endgroup::"
          done
          echo "expected_count=${#PROJECTS[@]}" >> "$GITHUB_OUTPUT"

      - name: Guard — lock-bestanden aanwezig en gevuld
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.restore.outputs.expected_count }}"
          mapfile -t LOCKFILES < <(find . -name 'packages.lock.json' -not -path './.git/*' | sort)
          FOUND="${#LOCKFILES[@]}"
          echo "Verwacht (op basis van .csproj-glob): $EXPECTED lock-bestand(en); gevonden: $FOUND"

          if [ "$FOUND" -lt "$EXPECTED" ]; then
            echo "::error::Te weinig packages.lock.json-bestanden gegenereerd ($FOUND van $EXPECTED verwacht) — restore is stilzwijgend onvolledig."
            exit 1
          fi

          FAILED=0
          for f in "${LOCKFILES[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is leeg."
              FAILED=1
              continue
            fi
            if ! python3 -c "import json,sys; d=json.load(open('$f',encoding='utf-8')); deps=d.get('dependencies') or {}; sys.exit(0 if any(deps.values()) else 1)"; then
              echo "::error::$f bevat geen 'dependencies'-sectie met pakketten."
              FAILED=1
            else
              echo "OK: $f"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Eén of meer lock-bestanden zijn leeg of onvolledig — zie SECURITY.md."
            exit 1
          fi
          echo "✅ Alle $FOUND lock-bestanden aanwezig en gevuld met dependencies."

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Upload Trivy results naar GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      # Guard ná Trivy: bewijst dat de scan hierboven daadwerkelijk NuGet-manifesten
      # gescand heeft, in plaats van te vertrouwen op de afwezigheid van een findings-lijst
      # (die ook betekent "niets gescand"). `aquasecurity/setup-trivy` (binnen de trivy-action
      # hierboven) zet de trivy-CLI op $GITHUB_PATH voor de rest van de job — geen aparte
      # installatiestap nodig. `--exit-code 0` hier: dit is geen tweede kwetsbaarheidspoort
      # (die staat al hierboven), uitsluitend een dekkingscontrole op de JSON-output.
      - name: Trivy JSON-output genereren voor dekkingscontrole
        if: always()
        run: |
          set -euo pipefail
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --ignore-unfixed \
            --format json --output trivy-results.json .

      - name: Guard — Trivy heeft daadwerkelijk NuGet-manifesten gescand
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s trivy-results.json ]; then
            echo "::error::trivy-results.json ontbreekt of is leeg — kan dekking niet verifiëren."
            exit 1
          fi
          SCANNED=$(python3 -c "import json; d=json.load(open('trivy-results.json',encoding='utf-8')); r=d.get('Results') or []; print(len([x for x in r if x.get('Class')=='lang-pkgs' and x.get('Type')=='nuget']))")
          echo "Aantal gescande NuGet-manifesten (lang-pkgs/nuget): $SCANNED"
          if [ "$SCANNED" -lt 1 ]; then
            echo "::error::Trivy heeft 0 NuGet-manifesten gescand — de dependency-scan dekt niets."
            echo "::error::Zie AGENTS.md/SECURITY.md § Dependency Vulnerability Scan (#1126)."
            exit 1
          fi
          echo "✅ Trivy heeft $SCANNED NuGet-manifest(en) daadwerkelijk gescand."

  # ── 4b. Statische analyse van eigen code (CodeQL) ───────────────────────────
  #
  # #1470: Trivy hierboven kijkt alleen naar pakketten van derden. Kwetsbaarheden in de eigen
  # C#, JavaScript of in de workflows zelf (injectie, SSRF, workflow-injectie) zag geen enkele
  # job. CodeQL is gratis voor een publieke repository. Het staat bewust in déze workflow en
  # niet in een losse codeql.yml: zo valt het onder de Security Gate, die al verplicht is op
  # main en develop — zonder wijziging aan de branch protection.
  #
  # De analyze-stap zelf faalt nooit op bevindingen; dat doet de stap erna, op dezelfde drempel
  # als Trivy (HIGH/CRITICAL = security-severity >= 7.0). Lagere bevindingen komen wel in
  # GitHub → Security → Code scanning, maar blokkeren niet.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # C# zonder build: CodeQL's buildless modus. Een echte build zou hier de
        # .NET 10-SDK plus de SSDT-uitsluiting (zie .slnf) moeten herhalen.
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL initialiseren
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Een PR uit een fork krijgt een read-only token; uploaden faalt daar. De drempelcheck
      # hieronder leest de lokale SARIF en werkt dus ook zonder upload.
      - name: CodeQL-analyse
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: codeql-sarif
          upload: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'never' || 'always' }}

      - name: Drempel — geen bevindingen met security-severity >= 7.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, sys

          DREMPEL = 7.0
          bestanden = glob.glob("codeql-sarif/*.sarif")
          if not bestanden:
              print("::error::Geen SARIF-uitvoer gevonden — de CodeQL-analyse heeft niets opgeleverd.")
              sys.exit(1)

          te_hoog = []
          totaal = 0
          for pad in bestanden:
              sarif = json.load(open(pad, encoding="utf-8"))
              for run in sarif.get("runs", []):
                  regels = {}
                  tool = run.get("tool", {})
                  for comp in [tool.get("driver", {})] + tool.get("extensions", []):
                      for r in comp.get("rules", []) or []:
                          sev = (r.get("properties") or {}).get("security-severity")
                          if sev is not None:
                              regels[r["id"]] = float(sev)
                  print(f"{pad}: {len(regels)} regels met security-severity, {len(run.get('results', []))} resultaten")
                  for res in run.get("results", []):
                      totaal += 1
                      if res.get("suppressions"):
                          continue
                      sev = regels.get(res.get("ruleId"), 0.0)
                      if sev >= DREMPEL:
                          loc = (res.get("locations") or [{}])[0].get("physicalLocation", {})
                          bestand = loc.get("artifactLocation", {}).get("uri", "?")
                          regel = loc.get("region", {}).get("startLine", "?")
                          te_hoog.append((sev, res.get("ruleId"), bestand, regel))

          if te_hoog:
              # Alleen regel-id en vindplaats: de berichttekst kan invoerwaarden citeren, en de
              # log van een publieke repo is publiek (zie #1225).
              print(f"::error::🚨 CODEQL: {len(te_hoog)} bevinding(en) met security-severity >= {DREMPEL}")
              for sev, rid, bestand, regel in sorted(te_hoog, reverse=True):
                  print(f"::error file={bestand},line={regel}::{rid} (security-severity {sev})")
              print("::error::Details: GitHub → Security → Code scanning. Zie SECURITY.md.")
              sys.exit(1)
          print(f"✅ Geen CodeQL-bevindingen met security-severity >= {DREMPEL} ({totaal} resultaten beoordeeld).")
          PY

  # ── 5. Security gate — blokkeert merge als bovenstaande checks falen ────────
  security-gate:
    name: "Security Gate — blokkeert merge bij fout"
    runs-on: ubuntu-latest
    needs: [gitleaks, pii-files, pii-patterns, pii-docs, infra-patterns, dependency-scan, codeql]
    if: always()
    steps:
      - name: Controleer alle verplichte security checks
        run: |
          FAILED=""
          [ "${{ needs.gitleaks.result }}"         != "success" ] && FAILED="${FAILED}\n  ❌ Secret Detection (gitleaks): ${{ needs.gitleaks.result }}"
          [ "${{ needs.pii-files.result }}"         != "success" ] && FAILED="${FAILED}\n  ❌ PII File Detection:           ${{ needs.pii-files.result }}"
          [ "${{ needs.pii-patterns.result }}"      != "success" ] && FAILED="${FAILED}\n  ❌ PII Pattern Scan:             ${{ needs.pii-patterns.result }}"
          [ "${{ needs.pii-docs.result }}"          != "success" ] && FAILED="${FAILED}\n  ❌ PII in Documentatie:          ${{ needs.pii-docs.result }}"
          [ "${{ needs.infra-patterns.result }}"    != "success" ] && FAILED="${FAILED}\n  ❌ Club-infrastructuur patronen: ${{ needs.infra-patterns.result }}"
          [ "${{ needs.dependency-scan.result }}"   != "success" ] && FAILED="${FAILED}\n  ❌ Dependency Vulnerability Scan: ${{ needs.dependency-scan.result }}"
          [ "${{ needs.codeql.result }}"            != "success" ] && FAILED="${FAILED}\n  ❌ CodeQL (eigen code):          ${{ needs.codeql.result }}"

          if [ -n "$FAILED" ]; then
            echo "::error::════════════════════════════════════════════════════"
            echo "::error::🚨  SECURITY CHECKS GEFAALD — MERGE GEBLOKKEERD  🚨"
            echo "::error::════════════════════════════════════════════════════"
            printf "::error::Gefaalde checks:${FAILED}\n"
            echo "::error::"
            echo "::error::Geen enkele wijziging gaat naar main totdat ALLE"
            echo "::error::security checks slagen. Zie SECURITY.md."
            echo "::error::════════════════════════════════════════════════════"
            exit 1
          fi

          echo "════════════════════════════════════════════════════"
          echo "✅  Alle security checks geslaagd — merge toegestaan"
          echo "════════════════════════════════════════════════════"
