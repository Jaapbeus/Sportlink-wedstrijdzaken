name: Issue-status bijhouden

# Dicht de voorkant van de issue-lifecycle (#690).
#
# label-awaiting-release.yml en close-released-issues.yml dekten alleen de achterkant:
# develop-merge → 'awaiting-release', release-tag → sluiten. Alles daarvóór had geen
# automatisering, waardoor een issue vanaf het aanmaken tot de develop-merge zonder
# status-label bleef staan. Bij de meting op 2026-07-27 gold dat voor 7 van de 18 open
# issues (39%) — inclusief issues waar op dat moment een open PR bij hoorde.
#
# Overgangen die deze workflow verzorgt:
#   issue geopend/heropend             → status: triage        (alleen als er nog geen status staat)
#   PR (draft) geopend voor het issue  → status: in-progress
#   PR ready for review                → status: review-needed
#   PR terug naar draft                → status: in-progress
#   PR gesloten zonder merge           → status: triage
#
# De merge naar develop is NIET van deze workflow: die zet 'awaiting-release' via
# label-awaiting-release.yml. Zie AGENTS.md, "Ontwikkelcyclus" (alinea "Labels").
#
# Beschermde statussen (ook awaiting-release) worden nooit door PR-events
# overschreven — zie PROTECTED in .github/scripts/issue-status.js.

on:
  issues:
    types: [opened, reopened]
  # pull_request_target gebruikt base-code met een schrijvend issue-token. De PR-tekst
  # mag daarom alleen status muteren na herkomst- en bevoegdheidscontrole.
  #
  # Veiligheid: deze workflow checkt uitsluitend de BASE-repo uit (het standaardgedrag
  # van pull_request_target) en voert nooit code of scripts uit de PR uit.
  # PR-titel en -body zijn onbetrouwbare invoer totdat de poort is gepasseerd.
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  status-bij-nieuw-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (voor .github/scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Triage-status zetten als er nog geen status staat
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { setIssueStatus } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-status.js`);
            await setIssueStatus({
              github,
              context,
              core,
              issueNumber: context.payload.issue.number,
              status: 'status: triage',
              // Nooit een bestaande status overschrijven: een heropend issue dat op
              // 'awaiting-release' stond hoort dat te blijven.
              onlyIfNone: true,
            });

  status-bij-pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (base-repo, voor .github/scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Status van de gekoppelde issues bijwerken
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { updatePullRequestIssueStatuses } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-status.js`);
            await updatePullRequestIssueStatuses({ github, context, core });
