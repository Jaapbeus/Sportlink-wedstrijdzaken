name: Label issues awaiting release

# Voegt 'status: awaiting-release' toe aan issues waarvan de fix net naar develop
# is gemerged. Develop wordt niet automatisch naar productie (main) uitgerold —
# dit label (en desnoods heropening) voorkomt dat een issue als 'klaar' oogt
# terwijl de fix nog niet live staat. Het label wordt weer verwijderd door
# close-released-issues.yml zodra de fix daadwerkelijk naar main gaat.
# Zie CLAUDE.md, sectie "Issue-lifecycle: awaiting-release".

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  label-awaiting-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (voor .github/scripts)
        uses: actions/checkout@v7

      - name: Issues labelen als 'awaiting-release'
        uses: actions/github-script@v9
        with:
          script: |
            // De status wordt via de gedeelde helper gezet zodat er hoogstens één
            // 'status: '-label op een issue staat. Voorheen werd 'awaiting-release'
            // alleen toegevoegd, waardoor een issue dat al op 'in-progress' of
            // 'review-needed' stond twee statussen tegelijk kreeg (#690).
            const { extractIssueRefs, setIssueStatus, isEpic } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-status.js`);

            const label = 'status: awaiting-release';
            const pr = context.payload.pull_request;

            // `all` voor het LABELEN van open issues: ruim scannen is daar onschadelijk en
            // levert de meeste zichtbaarheid op. `strong` voor het HEROPENEN van een al
            // gesloten issue — zie de toelichting bij extractIssueRefs (#630).
            const { all: numbers, strong } = extractIssueRefs(pr.title, pr.body);
            const mayReopen = n => strong.has(n);

            if (numbers.length === 0) {
              core.notice('Geen #issuenummer gevonden in PR-titel of -body — niets te labelen.');
              return;
            }

            for (const number of numbers) {
              let issue;
              try {
                issue = (await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                })).data;
              } catch (e) {
                core.warning(`#${number}: kon issue niet ophalen (${e.message}) — overgeslagen`);
                continue;
              }

              // issues.get retourneert ook PR's — die slaan we over.
              if (issue.pull_request) {
                continue;
              }

              // Epics zijn geen losse release-eenheid — ze worden nooit via een
              // commit-subject of CHANGELOG-attributie "gefixt", dus
              // close-released-issues.yml verwijdert hun label nooit. Zonder deze guard
              // blijft een epic permanent op awaiting-release staan zodra een
              // sub-issue-PR er ook maar in proza naar verwijst (#838).
              if (isEpic(issue)) {
                core.notice(`#${number}: draagt het label 'epic' — overgeslagen (geen losse release-eenheid)`);
                continue;
              }

              // Gesloten issue zonder titel- of sluitend-keyword-referentie: volledig overslaan.
              // Niet labelen en niet heropenen — het is hier alleen als kruisverwijzing genoemd (#630).
              if (issue.state === 'closed' && !mayReopen(number)) {
                core.notice(`#${number}: gesloten en alleen als kruisverwijzing genoemd — overgeslagen`);
                continue;
              }

              // respectProtected: false — een merge naar develop is een feit, niet een
              // voorkeur. Ook een issue dat op 'blocked' of 'waiting-owner' staat wacht
              // daarna echt op de release.
              await setIssueStatus({
                github,
                context,
                core,
                issueNumber: number,
                status: label,
                respectProtected: false,
              });

              if (issue.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  state: 'open',
                  state_reason: 'reopened',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  body: `🔄 Heropend: de fix zit sinds PR #${pr.number} in \`develop\`, maar \`develop\` is nog niet uitgerold naar productie (\`main\`). Dit issue sluit automatisch zodra de eerstvolgende release naar \`main\` gaat.`,
                });
                core.notice(`#${number}: heropend + gelabeld`);
              } else {
                core.notice(`#${number}: gelabeld`);
              }
            }
