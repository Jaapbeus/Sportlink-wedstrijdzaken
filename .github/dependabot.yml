version: 2
updates:
  # #1129: Central Package Management (Directory.Packages.props) verving de per-project
  # <PackageReference Version="..."> — één nuget-entry op de repo-root dekt nu alle projecten
  # (FunctionApp, FunctionApp.Postgres, BlazorAdmin, Planner.Shared, Database.Postgres* en de
  # testprojecten). Vóór CPM bumpte Dependabot alleen /FunctionApp en /BlazorAdmin, waardoor de
  # andere projecten uit de pas liepen (zie CHANGELOG en docs/DEVELOPER-SETUP.md §8.1).
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "NuGet"
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
        # #1363: QuestPDF komt altijd als eigen PR, nooit in de verzamel-PR. Het pakket valt onder
        # een eigen licentie (QuestPDF Community License) en de licentie die met een release
        # meekomt, geldt voor die release — elke bump is dus ook een licentiebeoordeling. Zie
        # docs/ARCHITECTUUR-PDF-EXPORT.md §2.
        exclude-patterns:
          - "QuestPDF"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "Actions"
    groups:
      github-actions:
        patterns:
          - "*"
