info:
  name: Teamlijst ophalen
  type: http
  seq: 20
  tags:
    - beheer

http:
  method: GET
  url: "{{baseUrl}}/api/beheer/teams"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /api/beheer/teams

  Teamlijst ophalen

  Geeft alle actieve teamnamen uit `his.teams`, gefilterd op ClubCode.
  Gebruikt door de Blazor Admin UI voor dropdowns in voorkeurstijden en teamregels.


  Spec declares security scheme "functionKey" (apiKey).
