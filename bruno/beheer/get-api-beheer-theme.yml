info:
  name: Club-thema ophalen
  type: http
  seq: 22
  tags:
    - beheer

http:
  method: GET
  url: "{{baseUrl}}/api/beheer/theme"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /api/beheer/theme

  Club-thema ophalen

  Geeft de huidige themakleuren, favicon-URL en logo-URL uit `dbo.AppSettings`.
  Geeft standaardwaarden terug als er nog geen thema is ingesteld.


  Spec declares security scheme "functionKey" (apiKey).
