http:
  method: GET
  url: "{{baseUrl}}/api/beheer/veldtraining"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /api/beheer/veldtraining

  Trainingsschema ophalen

  Geeft alle terugkerende trainingsblokken per veld per weekdag. De planner en de
  e-mailpijplijn behandelen een actief trainingsblok als bezetting, naast wedstrijden.


  Spec declares security scheme "functionKey" (apiKey).
