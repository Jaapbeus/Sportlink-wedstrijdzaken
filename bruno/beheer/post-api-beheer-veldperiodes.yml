info:
  name: Periode aanmaken
  type: http
  seq: 56
  tags:
    - beheer

http:
  method: POST
  url: "{{baseUrl}}/api/beheer/veldperiodes"
  body:
    type: json
    data: |-
      {
        "naam": "Zomerstop",
        "datumVan": "1970-01-01",
        "datumTot": "1970-01-01",
        "actief": true
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  POST /api/beheer/veldperiodes

  Periode aanmaken

  Overlapt de opgegeven range met een bestaande actieve periode van deze club, dan wordt de
  aanvraag met 409 geweigerd — er mag nooit meer dan één periode tegelijk actief zijn.


  Spec declares security scheme "functionKey" (apiKey).
