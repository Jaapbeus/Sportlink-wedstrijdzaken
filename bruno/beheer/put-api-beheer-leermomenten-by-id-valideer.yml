docs: |-
  PUT /api/beheer/leermomenten/{id}/valideer

  Leermoment valideren of afwijzen

  Zet `IsGevalideerd` of `IsAfgewezen` op het leermoment.
  Actie `valideer` → leermoment wordt gebruikt voor AI-training.
  Actie `afwijzen` → leermoment wordt genegeerd.


  Parameters:
    id (path, required) - Leermoment ID

  Spec declares security scheme "functionKey" (apiKey).

  Some values below were invented; check them before sending.
