info:
  name: Teams met beschikbare begeleiding ophalen
  type: http
  seq: 17
  tags:
    - beheer

http:
  method: GET
  url: "{{baseUrl}}/api/beheer/teambegeleiding"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /api/beheer/teambegeleiding

  Teams met beschikbare begeleiding ophalen

  Geeft de unieke teamnamen waarvoor begeleiding (teamrollen) beschikbaar is
  in `avg.Teambegeleiding`.


  Spec declares security scheme "functionKey" (apiKey).
