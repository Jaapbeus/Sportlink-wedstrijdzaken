info:
  name: Club-lijst ophalen (multi-club)
  type: http
  seq: 8
  tags:
    - beheer

http:
  method: GET
  url: "{{baseUrl}}/api/beheer/clubs"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  GET /api/beheer/clubs

  Club-lijst ophalen (multi-club)

  Geeft alle clubs uit `dbo.AppSettings`, gesorteerd op sync-status en naam.
  Gebruikt door de Blazor Admin UI voor de club-selector dropdown.


  Spec declares security scheme "functionKey" (apiKey).
