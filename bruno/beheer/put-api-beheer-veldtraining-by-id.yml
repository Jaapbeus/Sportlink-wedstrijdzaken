info:
  name: Trainingsblok bijwerken
  type: http
  seq: 50
  tags:
    - beheer

http:
  method: PUT
  url: "{{baseUrl}}/api/beheer/veldtraining/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "veldNummer": 1,
        "dagVanWeek": 1,
        "vanTijd": "19:00",
        "totTijd": "20:30",
        "omschrijving": "string",
        "actief": true
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: lt
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  PUT /api/beheer/veldtraining/{id}

  Trainingsblok bijwerken

